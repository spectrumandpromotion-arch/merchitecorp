<style>

  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}

<script>
(function(){
'use strict';
var N_SHIFTS=3, LOTTERY_SHIFT=2;
var GAS=[['g87','87'],['g89','89'],['g93','93']];
var DEFAULT_TYPES=['Lottery','Western Union','Vendor','Other'];
var LS_SET='gas-shift-sheet-settings-v1';
var LS_KEY='gas-shift-sheet-v1';

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(String(v==null?'':v).replace(/[$,\s]/g,''));return isFinite(n)?n:0;}
function r2(x){return Math.round((x+1e-9)*100)/100;}
function sum(a){return a.reduce(function(t,x){return t+x;},0);}
function usd(x){var v=r2(x);var s=Math.abs(v).toLocaleString('en-US',{style:'currency',currency:'USD'});return v<0?'−'+s:s;}
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function toDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(toDate(s).getTime());}

/* ---------- data model ---------- */
function blankShift(){
  return {name:'',drops:[{t:'',n:'',a:''}],bills:'',coins:{q:'',d:'',n:'',p:''},
    credit:'',debit:'',ebt:'',coupons:'',fees:'',
    payouts:[{cat:state.settings.types[0]||'',desc:'',amt:''}],
    fuel:'',merch:'',tax:'',
    lotI:'',lotO:'',lotC:'',
    gas:{g87:{gal:'',pr:''},g89:{gal:'',pr:''},g93:{gal:'',pr:''}}};
}
function norm(src,base){
  if(Array.isArray(base)){
    if(!Array.isArray(src)||!src.length)return base;
    return src.map(function(x){return norm(x,base[0]);});
  }
  if(base&&typeof base==='object'){
    var out={},s=(src&&typeof src==='object')?src:{};
    Object.keys(base).forEach(function(k){out[k]=norm(s[k],base[k]);});
    return out;
  }
  return (typeof src==='string'||typeof src==='number')?String(src):base;
}
function normShift(s){return norm(s,blankShift());}
function normDay(d){
  var sh=[];for(var i=0;i<N_SHIFTS;i++)sh.push(normShift(d&&d.shifts?d.shifts[i]:null));
  return {shifts:sh,added:!!(d&&d.added)};
}

/* ---------- calculations ---------- */
function calc(s,idx){
  var o={},T0=state.settings.types[0]||'';
  o.dropsT=r2(sum(s.drops.map(function(d){return num(d.a);})));
  o.bills=num(s.bills);
  var q=num(s.coins.q),d=num(s.coins.d),n=num(s.coins.n),p=num(s.coins.p);
  o.cq=r2(q*.25);o.cd=r2(d*.10);o.cn=r2(n*.05);o.cp=r2(p*.01);
  o.coins=(q*25+d*10+n*5+p)/100;
  o.cash=r2(o.dropsT+o.bills+o.coins);
  o.credit=num(s.credit);o.debit=num(s.debit);o.ebt=num(s.ebt);o.coupons=num(s.coupons);o.fees=num(s.fees);
  o.cards=r2(o.credit+o.debit);o.cardsNet=r2(o.cards-o.fees);
  o.payT=r2(sum(s.payouts.map(function(x){return num(x.amt);})));
  o.payLot=r2(sum(s.payouts.filter(function(x){return /lottery/i.test(x.cat||T0);}).map(function(x){return num(x.amt);})));
  o.collected=r2(o.cash+o.credit+o.debit+o.ebt+o.coupons+o.payT);
  var isLot=(idx===LOTTERY_SHIFT);
  var gasAmt=0,gasGal=0,gp=state.settings.gas;
  var profT=0,cd_=state.calcDate||state.date;
  GAS.forEach(function(g){var r=s.gas[g[0]];var gl=isLot?num(r.gal):0,pr=r.pr!==''?num(r.pr):num(gp[g[0]]);var cost=num(costFor(cd_,g[0]));o[g[0]]=r2(gl*pr);o[g[0]+'g']=gl;o[g[0]+'m']=cost>0?(pr-cost):0;o[g[0]+'p']=r2(cost>0?gl*(pr-cost):0);profT+=(cost>0?gl*(pr-cost):0);gasAmt+=gl*pr;gasGal+=gl;});
  o.gasAmt=r2(gasAmt);o.gasGal=gasGal;o.gasProfit=r2(profT);
  o.fuelAuto=o.gasAmt;
  o.fuel=s.fuel.trim()!==''?num(s.fuel):o.gasAmt;
  o.merch=num(s.merch);o.tax=num(s.tax);
  o.lotI=isLot?num(s.lotI):0;
  o.lotO=isLot?num(s.lotO):0;
  o.lotC=isLot?num(s.lotC):0;
  o.lotSales=r2(o.lotI+o.lotO+o.lotC);
  o.lotNet=r2(o.lotSales-o.payLot);
  o.sales=r2(o.fuel+o.merch+o.tax+o.lotSales);
  o.so=r2(o.collected-o.sales);
  o.has=(o.collected!==0||o.sales!==0||s.name.trim()!=='');
  return o;
}
function soInfo(x,has){
  if(!has)return {cls:'',word:'No entries'};
  if(Math.abs(x)<0.005)return {cls:'ok',word:'Balanced'};
  return x<0?{cls:'short',word:'Short'}:{cls:'over',word:'Over'};
}
function soText(x){var v=r2(x);return (v>0?'+':'')+usd(v);}
function fmtOut(v,f){
  v=v||0;
  if(f==='n')return String(v);
  if(f==='gal')return String(Number(v.toFixed(3)));
  if(f==='so')return soText(v);
  if(f==='m')return v?((v<0?'\u2212':'')+'$'+Math.abs(v).toFixed(3)):'\u2014';
  return usd(v);
}

/* ---------- state ---------- */

var SYNC_URL='https://script.google.com/macros/s/AKfycbxjongQ5prQyIv9lP4kv-55cpiWcQhxikBVcuCpWC2s7ij7GTHDmn0Q_cohPZQtqy5_Cg/exec';
function syncShift(date, idx){
  try{
    var day=state.days[date]; if(!day) return Promise.resolve(false);
    var sh=day.shifts[idx]; var c=calc(sh, idx);
    if(!c.has) return Promise.resolve(false);
    var payload={
      date: date, shift: idx+1, cashier: sh.name||'',
      cash: c.cash, dropsTotal: c.dropsT, credit: c.credit, debit: c.debit,
      ebt: c.ebt, coupons: c.coupons, fees: c.fees,
      payOutsTotal: c.payT,
      payOutsDetail: sh.payouts.map(function(x){return (x.cat||'')+': '+(x.desc||'')+' $'+num(x.amt);}).join('; '),
      fuelSales: c.fuel, merchSales: c.merch, tax: c.tax, lotterySales: c.lotSales, lotteryCash: c.lotC,
      totalSales: c.sales, collected: c.collected, shortOver: c.so,
      gas87gal: c.g87g, gas89gal: c.g89g, gas93gal: c.g93g, gasSales: c.gasAmt,
      gasProfit: c.gasProfit, gas87profit: c.g87p, gas89profit: c.g89p, gas93profit: c.g93p
    };
    return fetch(SYNC_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload)})
      .then(function(){ return true; }).catch(function(){ return false; });
  }catch(e){ return Promise.resolve(false); }
}
function syncDay(date){
  var ps=[]; for(var i=0;i<N_SHIFTS;i++) ps.push(syncShift(date,i));
  return Promise.all(ps).then(function(rs){ return rs.some(function(x){return x;}); });
}

var LS_UP='gas-shift-sheet-uploaded-v1';
function readUploaded(){try{var m=JSON.parse(localStorage.getItem(LS_UP)||'{}');return m&&typeof m==='object'?m:{};}catch(e){return {};}}
function markUploaded(d){try{var m=readUploaded();m[d]=new Date().toISOString();localStorage.setItem(LS_UP,JSON.stringify(m));}catch(e){}}
function clearUploaded(d){try{var m=readUploaded();delete m[d];localStorage.setItem(LS_UP,JSON.stringify(m));}catch(e){}}
function uploadedAt(d){return readUploaded()[d]||'';}
function fmtUpTime(iso){try{return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
function deleteDateFromSheets(d){
  try{
    return fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'delete',date:d})}).then(function(){return true;}).catch(function(){return false;});
  }catch(e){return Promise.resolve(false);}
}
function doDeleteDate(d){
  if(!validDate(d))return;
  var wasOpen=(d===state.date);
  delete state.days[d];clearUploaded(d);markDirty(d);
  setStatus('','Deleting '+fmtDay(d)+' from website and sheets…');
  deleteDateFromSheets(d).then(function(ok){
    if(ok)setStatus('ok','Deleted '+fmtDay(d)+' from website and sheets.');
    else setStatus('warn','Deleted from this device, but the sheet delete did not go through — check connection and delete the date again.');
  });
  if(wasOpen){ensureDay(todayStr());state.date=todayStr();}
  renderAll();
}

function setStatus(kind,text){var el=$('#status');el.className='status'+(kind?' '+kind:'');el.textContent=text;}
function readLocal(){try{var raw=localStorage.getItem(LS_KEY);return raw?JSON.parse(raw):{};}catch(e){return {};}}
function writeLocal(){try{
  var out={};Object.keys(state.days).forEach(function(k){out[k]=state.days[k];});
  localStorage.setItem(LS_KEY,JSON.stringify(out));return true;}catch(e){return false;}}
function markDirty(d){
  d=d||state.date;dirty[d]=true;ver[d]=(ver[d]||0)+1;
  setStatus('','Saving…');
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
function flush(){
  if(saving){saveTimer=setTimeout(flush,300);return;}
  var keys=Object.keys(dirty);
  if(!keys.length)return;
  saving=true;
  var chain=Promise.resolve(),failed=null;
  keys.forEach(function(d){
    chain=chain.then(function(){
      var v=ver[d],day=state.days[d];
      var op;
      if(mode==='db'){
        op=day?dbCol.doc(d).set({shifts:day.shifts,added:!!day.added,savedAt:Date.now()}):dbCol.doc(d).delete();
      }else{
        op=Promise.resolve(writeLocal()?null:Promise.reject({message:'storage'}));
      }
      return op.then(function(){if(ver[d]===v)delete dirty[d];});
    }).catch(function(e){failed=e;});
  });
  chain.then(function(){
    saving=false;
    if(failed){setStatus('warn',"Couldn't save. You may have view-only access.");}
    else if(Object.keys(dirty).length){saveTimer=setTimeout(flush,300);}
    else setStatus('ok',mode==='db'?'Saved':'Saved on this device only — tap Upload to Sheets to send it to the reports');
  });
}

function saveSettings(which){
  if(mode==='db'&&dbSet){
    var g=state.settings.gas;
    var data=which==='types'?{names:state.settings.types}:which==='cost'?{entries:state.settings.cost}:{g87:g.g87,g89:g.g89,g93:g.g93};
    setStatus('','Saving…');
    dbSet.doc(which==='types'?'payoutTypes':which==='cost'?'gasCost':'gas').set(data).then(function(){setStatus('ok','Saved');},function(){
      setStatus('warn',which==='types'?"Couldn't save names. Only the owner can change them.":which==='cost'?"Couldn't save cost. Only the owner can change it.":"Couldn't save prices.");});
  }else{
    try{localStorage.setItem(LS_SET,JSON.stringify(state.settings));setStatus('ok','Saved on this device only');}
    catch(e){setStatus('warn',"Couldn't save.");}
  }
}
function mergeSettings(src){
  if(!src||typeof src!=='object')return;
  if(Array.isArray(src.cost)){
    state.settings.cost=src.cost.filter(function(e){return e&&typeof e.d==='string'&&validDate(e.d);}).map(function(e){
      return {d:e.d,g87:String(e.g87||''),g89:String(e.g89||''),g93:String(e.g93||'')};});
  }
  if(Array.isArray(src.types)){
    var t=src.types.filter(function(x){return typeof x==='string'&&x.trim();});
    if(t.length)state.settings.types=t;
  }
  if(src.gas&&typeof src.gas==='object')GAS.forEach(function(g){
    var v=src.gas[g[0]];if(typeof v==='string'||typeof v==='number')state.settings.gas[g[0]]=String(v);});
}

function drepLoad(force){

      setStatus('warn','Tap Delete again to delete '+fmtDay(dd)+' from the website and the sheets. There is no undo.');
      clearTimeout(R._delT);
      R._delT=setTimeout(function(){R.delArm='';var bb=document.querySelector('[data-rep="del-date"]');if(bb)bb.textContent='Delete date…';},4000);
      return;
    }
    var ddel=R.delArm;R.delArm='';
    doDeleteDate(ddel);
    return;
  }
  else return;
  renderReports();updateLive();
});
main.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.repDate!==undefined&&state.tab===N_SHIFTS+1&&validDate(t.value)){state.rep.date=t.value;renderReports();updateLive();}
});
main.addEventListener('click',function(e){
  var b=e.target.closest('[data-drep]');if(!b||state.tab!==N_SHIFTS+2)return;
  var k=b.dataset.drep,D=state.drep;
  if(k==='mode-shift'){D.mode='shift';}
  else if(k==='mode-day'){D.mode='day';}
  else if(k==='mode-week'){D.mode='week';}
  else if(k==='today'){D.date=todayStr();}
  else if(k==='prev-day'){D.date=addDaysStr(D.date,-1);}
  else if(k==='next-day'){D.date=addDaysStr(D.date,1);}
  else if(k==='prev-week'){D.date=addDaysStr(D.date,-7);}
  else if(k==='next-week'){D.date=addDaysStr(D.date,7);}
  else if(k==='refresh'){drepLoad(true);return;}
  else if(k.indexOf('shift-')===0){D.shift=Number(k.slice(6));D.mode='shift';}
  else if(k.indexOf('day-')===0){D.date=k.slice(4);D.mode='day';}
  else return;
  renderDailyReports();updateLive();
});
main.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.drepDate!==undefined&&state.tab===N_SHIFTS+2&&validDate(t.value)){state.drep.date=t.value;renderDailyReports();updateLive();}
});
$('#dates').addEventListener('click',function(e){var b=e.target.closest('[data-date]');if(b)openDate(b.dataset.date,false);});
$('#datePick').addEventListener('change',function(e){if(e.target.value)openDate(e.target.value,true);});
$('#todayBtn').addEventListener('click',function(){openDate(todayStr(),true);});
$('#delDay').addEventListener('click',function(){
  var btn=$('#delDay');
  if(!armed){armed=true;btn.textContent='Tap again to delete '+state.date+' (website + sheets)';btn.classList.add('armed');clearTimeout(armTimer);armTimer=setTimeout(function(){armed=false;btn.textContent='Delete this day';btn.classList.remove('armed');},4000);return;}
  clearTimeout(armTimer);armed=false;btn.textContent='Delete this day';btn.classList.remove('armed');
  doDeleteDate(state.date);
});

var uploading=false;
$('#uploadBtn').addEventListener('click',function(){
  var d=state.date,btn=$('#uploadBtn');
  if(uploading)return;
  var dc=state.days[d]?dayCalc(d):null;
  if(!dc||!dc.has){setStatus('warn','Nothing to upload for '+fmtDay(d)+' — no entries yet.');return;}
  uploading=true;btn.disabled=true;
  setStatus('','Uploading '+fmtDay(d)+' to Sheets…');
  syncDay(d).then(function(ok){
    uploading=false;btn.disabled=false;
    if(ok){markUploaded(d);setStatus('ok','Uploaded to Sheets ✓ '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}));}
    else setStatus('warn','Upload failed — check connection and tap Upload to Sheets again.');
    if(state.tab===N_SHIFTS+1){renderReports();updateLive();}
  });
});

/* ---------- boot ---------- */
function typing(){var a=document.activeElement;return a&&main.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);}
function refreshView(){
  if(state.tab===N_SHIFTS){renderDay();updateLive();return;}
  if(state.tab===N_SHIFTS+1){renderReports();updateLive();return;}
  if(state.tab===N_SHIFTS+2){renderDailyReports();updateLive();return;}
  if(typing())updateLive();else{renderShift();updateLive();}
}
function startLocal(){
  mode='local';state.isOwner=true;
  try{mergeSettings(JSON.parse(localStorage.getItem(LS_SET)||'null'));}catch(e){}
  var loc=readLocal();
  Object.keys(loc).forEach(function(k){if(validDate(k)&&!dirty[k])state.days[k]=normDay(loc[k]);});
  ensureDay(state.date);
  renderAll();
  setStatus('ok','Saved on this device only');
}
function startDb(db){
  mode='db';dbCol=db.collection('days');dbSet=db.collection('settings');
  var loadTimer=setTimeout(function(){setStatus('warn',"Can't reach saved data yet. Still trying.");},10000);
  dbSet.onSnapshot(function(snap){
    snap.docs.forEach(function(d){
      var v=d.data()||{};
      if(d.id==='payoutTypes')mergeSettings({types:v.names});
      if(d.id==='gas')mergeSettings({gas:v});
      if(d.id==='gasCost')mergeSettings({cost:v.entries});
    });
    if(state.ui.gasEdit||state.ui.typesEdit)updateLive();else refreshView();
  },function(){});
  dbCol.onSnapshot(function(snap){
    clearTimeout(loadTimer);
    var changedCur=false;
    snap.docChanges().forEach(function(ch){
      var id=ch.doc.id;if(!validDate(id))return;
      if(dirty[id]||ch.doc.metadata.hasPendingWrites)return;
      if(ch.type==='removed'){
        if(state.days[id]){delete state.days[id];if(id===state.date){changedCur=true;ensureDay(id);}}
        return;
      }
      var nd=normDay(ch.doc.data()),old=state.days[id];
      if(!old||JSON.stringify(old)!==JSON.stringify(nd)){state.days[id]=nd;if(id===state.date)changedCur=true;}
    });
    ensureDay(state.date);
    renderDates();
    if(changedCur){if(typing())updateLive();else renderAll();}else updateLive();
    if(!Object.keys(dirty).length)setStatus('ok',snap.metadata.fromCache?'Loading saved days…':'Saved');
  },function(err){
    clearTimeout(loadTimer);
    setStatus('warn','Saved data unavailable ('+(err&&err.code||'error')+')');
  });
}
function boot(){
  state.date=todayStr();ensureDay(state.date);
  var h=location.hash||'';
  if(h==='#reports')state.tab=N_SHIFTS+1;
  else if(h==='#daily-reports')state.tab=N_SHIFTS+2;
  renderAll();
  if(state.tab===N_SHIFTS+2)drepLoad(false);
  setStatus('','Loading…');
  var use=(window.claude&&window.claude.use)?window.claude.use.bind(window.claude):null;
  Promise.resolve(use?use('db'):null).then(function(db){
    if(!db){startLocal();return;}
    startDb(db);
    return Promise.resolve(use('user')).then(function(u){return u?u.isOwner():false;}).then(function(o){
      state.isOwner=!!o;
      if(!state.ui.typesEdit&&!state.ui.gasEdit)refreshView();
    });
  }).catch(function(){if(mode==='init')startLocal();});
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){clearTimeout(saveTimer);flush();}});
window.addEventListener('pagehide',function(){clearTimeout(saveTimer);flush();});
boot();
})();
</script>
