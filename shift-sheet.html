<style>

}

.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}

.link{background:none;border:0;padding:2px 0;color:var(--accent);font-weight:600;font-size:13px}

.link.danger{color:var(--short)}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
.bar-in{max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Gas Station Shift Sheet</h1>

    </div>
    <div class="datebar">
      <label class="datepick" for="datePick"><span>Add or open a date</span><input type="date" id="datePick"></label>
      <button class="btn" id="todayBtn" type="button">Today</button>
      <button class="btn danger" id="delDay" type="button">Delete this day</button>
    </div>

  </header>

</div>
<div id="bar" class="bar"><div class="bar-in">
  <div class="bl"><span class="bt" id="barTitle"></span><span class="bs" id="barSub"></span></div>

</div></div>

<script>
(function(){
'use strict';
var N_SHIFTS=3, LOTTERY_SHIFT=2;
var GAS=[['g87','87'],['g89','89'],['g93','93']];
var DEFAULT_TYPES=['Lottery','Western Union','Vendor','Other'];
var LS_SET='gas-shift-sheet-settings-v1';
var LS_KEY='gas-shift-sheet-v1';

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(String(v==null?'':v).replace(/[$,\s]/g,''));return isFinite(n)?n:0;}
function r2(x){return Math.round((x+1e-9)*100)/100;}
function sum(a){return a.reduce(function(t,x){return t+x;},0);}
function usd(x){var v=r2(x);var s=Math.abs(v).toLocaleString('en-US',{style:'currency',currency:'USD'});return v<0?'−'+s:s;}
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function toDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(toDate(s).getTime());}

/* ---------- data model ---------- */
function blankShift(){
  return {name:'',drops:[{t:'',n:'',a:''}],bills:'',coins:{q:'',d:'',n:'',p:''},
    credit:'',debit:'',ebt:'',coupons:'',fees:'',
    payouts:[{cat:state.settings.types[0]||'',desc:'',amt:''}],
    fuel:'',merch:'',tax:'',
    lotI:'',lotO:'',
    gas:{g87:{gal:'',pr:''},g89:{gal:'',pr:''},g93:{gal:'',pr:''}}};
}
function norm(src,base){
  if(Array.isArray(base)){
    if(!Array.isArray(src)||!src.length)return base;
    return src.map(function(x){return norm(x,base[0]);});
  }
  if(base&&typeof base==='object'){
    var out={},s=(src&&typeof src==='object')?src:{};
    Object.keys(base).forEach(function(k){out[k]=norm(s[k],base[k]);});
    return out;
  }
  return (typeof src==='string'||typeof src==='number')?String(src):base;
}
function normShift(s){return norm(s,blankShift());}
function normDay(d){
  var sh=[];for(var i=0;i<N_SHIFTS;i++)sh.push(normShift(d&&d.shifts?d.shifts[i]:null));
  return {shifts:sh,added:!!(d&&d.added)};
}

/* ---------- calculations ---------- */
function calc(s,idx){
  var o={},T0=state.settings.types[0]||'';
  o.dropsT=r2(sum(s.drops.map(function(d){return num(d.a);})));
  o.bills=num(s.bills);
  var q=num(s.coins.q),d=num(s.coins.d),n=num(s.coins.n),p=num(s.coins.p);
  o.cq=r2(q*.25);o.cd=r2(d*.10);o.cn=r2(n*.05);o.cp=r2(p*.01);
  o.coins=(q*25+d*10+n*5+p)/100;
  o.cash=r2(o.dropsT+o.bills+o.coins);
  o.credit=num(s.credit);o.debit=num(s.debit);o.ebt=num(s.ebt);o.coupons=num(s.coupons);o.fees=num(s.fees);
  o.cards=r2(o.credit+o.debit);o.cardsNet=r2(o.cards-o.fees);
  o.payT=r2(sum(s.payouts.map(function(x){return num(x.amt);})));
  o.payLot=r2(sum(s.payouts.filter(function(x){return /lottery/i.test(x.cat||T0);}).map(function(x){return num(x.amt);})));
  o.collected=r2(o.cash+o.credit+o.debit+o.ebt+o.coupons+o.payT);
  var isLot=(idx===LOTTERY_SHIFT);
  var gasAmt=0,gasGal=0,gp=state.settings.gas;
  var profT=0,cd_=state.calcDate||state.date;
  GAS.forEach(function(g){var r=s.gas[g[0]];var gl=isLot?num(r.gal):0,pr=r.pr!==''?num(r.pr):num(gp[g[0]]);var cost=num(costFor(cd_,g[0]));o[g[0]]=r2(gl*pr);o[g[0]+'g']=gl;o[g[0]+'m']=cost>0?(pr-cost):0;o[g[0]+'p']=r2(cost>0?gl*(pr-cost):0);profT+=(cost>0?gl*(pr-cost):0);gasAmt+=gl*pr;gasGal+=gl;});
  o.gasAmt=r2(gasAmt);o.gasGal=gasGal;o.gasProfit=r2(profT);
  o.fuelAuto=o.gasAmt;
  o.fuel=s.fuel.trim()!==''?num(s.fuel):o.gasAmt;
  o.merch=num(s.merch);o.tax=num(s.tax);
  o.lotI=isLot?num(s.lotI):0;
  o.lotO=isLot?num(s.lotO):0;
  o.lotSales=r2(o.lotI+o.lotO);
  o.lotNet=r2(o.lotSales-o.payLot);
  o.sales=r2(o.fuel+o.merch+o.tax+o.lotSales);
  o.so=r2(o.collected-o.sales);
  o.has=(o.collected!==0||o.sales!==0||s.name.trim()!=='');
  return o;
}
function soInfo(x,has){
  if(!has)return {cls:'',word:'No entries'};
  if(Math.abs(x)<0.005)return {cls:'ok',word:'Balanced'};
  return x<0?{cls:'short',word:'Short'}:{cls:'over',word:'Over'};
}
function soText(x){var v=r2(x);return (v>0?'+':'')+usd(v);}
function fmtOut(v,f){
  v=v||0;
  if(f==='n')return String(v);
  if(f==='gal')return String(Number(v.toFixed(3)));
  if(f==='so')return soText(v);
  if(f==='m')return v?((v<0?'\u2212':'')+'$'+Math.abs(v).toFixed(3)):'\u2014';
  return usd(v);
}

/* ---------- state ---------- */
var state={days:{},date:'',tab:0,cs:[],isOwner:false,settings:{types:DEFAULT_TYPES.slice(),gas:{g87:'',g89:'',g93:''},cost:[]},ui:{gasEdit:false,gasDraft:{},costEdit:false,costDraft:{},typesEdit:false,typesDraft:[]}};
var mode='init',dbCol=null,dbSet=null;
var dirty={},ver={},saving=false,saveTimer=null,armed=false,armTimer=null,resetArmed=false,resetTimer=null;
function ensureDay(d){if(!state.days[d])state.days[d]=normDay(null);return state.days[d];}
function cur(){return state.days[state.date].shifts[state.tab];}
function getP(o,p){return p.split('.').reduce(function(a,k){return a==null?a:a[k];},o);}
function setP(o,p,v){var ks=p.split('.');for(var i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;}
function pid(p){return 's'+state.tab+'-'+p.replace(/\./g,'-');}

/* ---------- persistence ---------- */
/* ---------- sync to Google Sheet (Uptown Shell - Shift Sheet Sync) ---------- */
var SYNC_URL='https://script.google.com/macros/s/AKfycbxjongQ5prQyIv9lP4kv-55cpiWcQhxikBVcuCpWC2s7ij7GTHDmn0Q_cohPZQtqy5_Cg/exec';
var syncTimer=null, syncPendingDays=[], syncRunning=false;
function syncShift(date, idx){
  try{
    var day=state.days[date]; if(!day) return Promise.resolve(false);
    var sh=day.shifts[idx]; var c=calc(sh, idx);
    if(!c.has) return Promise.resolve(false);
    var payload={
      date: date, shift: idx+1, cashier: sh.name||'',
      cash: c.cash, dropsTotal: c.dropsT, credit: c.credit, debit: c.debit,
      ebt: c.ebt, coupons: c.coupons, fees: c.fees,
      payOutsTotal: c.payT,
      payOutsDetail: sh.payouts.map(function(x){return (x.cat||'')+': '+(x.desc||'')+' $'+num(x.amt);}).join('; '),
      fuelSales: c.fuel, merchSales: c.merch, tax: c.tax, lotterySales: c.lotSales,
      totalSales: c.sales, collected: c.collected, shortOver: c.so,
      gas87gal: c.g87g, gas89gal: c.g89g, gas93gal: c.g93g, gasSales: c.gasAmt
    };
    return fetch(SYNC_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload)})
      .then(function(){ return true; }).catch(function(){ return false; });
  }catch(e){ return Promise.resolve(false); }
}
function syncDay(date){
  var ps=[]; for(var i=0;i<N_SHIFTS;i++) ps.push(syncShift(date,i));
  return Promise.all(ps).then(function(rs){ return rs.some(function(x){return x;}); });
}

function setStatus(kind,text){var el=$('#status');el.className='status'+(kind?' '+kind:'');el.textContent=text;}
function readLocal(){try{var raw=localStorage.getItem(LS_KEY);return raw?JSON.parse(raw):{};}catch(e){return {};}}
function writeLocal(){try{
  var out={};Object.keys(state.days).forEach(function(k){out[k]=state.days[k];});
  localStorage.setItem(LS_KEY,JSON.stringify(out));return true;}catch(e){return false;}}
function markDirty(d){
  d=d||state.date;dirty[d]=true;ver[d]=(ver[d]||0)+1;
  setStatus('','Saving…');
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
function flush(){
  if(saving){saveTimer=setTimeout(flush,300);return;}
  var keys=Object.keys(dirty);
  if(!keys.length)return;
  saving=true;
  var chain=Promise.resolve(),failed=null;
  keys.forEach(function(d){
    chain=chain.then(function(){
      var v=ver[d],day=state.days[d];
      var op;
      if(mode==='db'){
        op=day?dbCol.doc(d).set({shifts:day.shifts,added:!!day.added,savedAt:Date.now()}):dbCol.doc(d).delete();
      }else{
        op=Promise.resolve(writeLocal()?null:Promise.reject({message:'storage'}));
      }
      return op.then(function(){if(ver[d]===v)delete dirty[d];});
    }).catch(function(e){failed=e;});
  });
  chain.then(function(){
    saving=false;
    if(failed){setStatus('warn',"Couldn't save. You may have view-only access.");}
    else if(Object.keys(dirty).length){saveTimer=setTimeout(flush,300);}
    else {
      setStatus('ok',mode==='db'?'Saved':'Saved on this device only');
      // Sync each saved day to the Google Sheet (cash/card/safe for reports),
      // but only after 6 seconds with no further saves — so typing a shift
      // sends ONE sync per date+shift (1, 2 or 3), never a row per keystroke.
      // Syncs run one at a time so they cannot race and duplicate rows.
      clearTimeout(syncTimer);
      syncPendingDays = keys.slice();
      syncTimer = setTimeout(function(){
        if(syncRunning) return;
        syncRunning = true;
        (function nextSync(){
          var d=syncPendingDays.shift(); if(!d){ syncRunning=false; return; }
          syncDay(d).then(function(ok){
            if(ok) setStatus('ok','Saved + synced to Sheet');
            nextSync();
          });
        })();
      }, 6000);
    }
  });
}

function saveSettings(which){
  if(mode==='db'&&dbSet){
    var g=state.settings.gas;
    var data=which==='types'?{names:state.settings.types}:which==='cost'?{entries:state.settings.cost}:{g87:g.g87,g89:g.g89,g93:g.g93};
    setStatus('','Saving…');
    dbSet.doc(which==='types'?'payoutTypes':which==='cost'?'gasCost':'gas').set(data).then(function(){setStatus('ok','Saved');},function(){
      setStatus('warn',which==='types'?"Couldn't save names. Only the owner can change them.":which==='cost'?"Couldn't save cost. Only the owner can change it.":"Couldn't save prices.");});
  }else{
    try{localStorage.setItem(LS_SET,JSON.stringify(state.settings));setStatus('ok','Saved on this device only');}
    catch(e){setStatus('warn',"Couldn't save.");}
  }
}
function mergeSettings(src){
  if(!src||typeof src!=='object')return;
  if(Array.isArray(src.cost)){
    state.settings.cost=src.cost.filter(function(e){return e&&typeof e.d==='string'&&validDate(e.d);}).map(function(e){
      return {d:e.d,g87:String(e.g87||''),g89:String(e.g89||''),g93:String(e.g93||'')};});
  }
  if(Array.isArray(src.types)){
    var t=src.types.filter(function(x){return typeof x==='string'&&x.trim();});
    if(t.length)state.settings.types=t;
  }
  if(src.gas&&typeof src.gas==='object')GAS.forEach(function(g){
    var v=src.gas[g[0]];if(typeof v==='string'||typeof v==='number')state.settings.gas[g[0]]=String(v);});
}
function costFor(d,k){var best=null;state.settings.cost.forEach(function(e){if(e.d<=d&&(!best||e.d>best.d))best=e;});return best&&num(best[k])>0?best[k]:'';}
function costSince(d){var best=null;state.settings.cost.forEach(function(e){if(e.d<=d&&(!best||e.d>best.d))best=e;});return best?best.d:'';}
function fmtDay(d){return toDate(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function priceOf(s,k){return s.gas[k].pr!==''?s.gas[k].pr:state.settings.gas[k];}

function renderDay(){
  var cs=state.cs.length?state.cs:state.days[state.date].shifts.map(calc);
  var day=state.days[state.date];
  var rows=[
    ['grp','Money collected'],['Cash','cash'],['Credit','credit'],['Debit','debit'],['EBT','ebt'],['Coupons','coupons'],['Payouts','payT'],['Total collected','collected','key'],
    ['grp','Sales'],['Fuel','fuel'],['Merchandise','merch'],['Sales tax','tax'],['Lottery sold','lotSales'],['Total sales','sales','key'],
    ['grp','Result'],['Cash short / over','so','key so']
  ];
  var h='<div class="card"><h2>Day total</h2><div class="tbl"><table><thead><tr><th></th><th>Shift 1</th><th>Shift 2</th><th>Shift 3</th><th>Day</th></tr></thead><tbody>';
  h+='<tr><td>Cashier</td>'+day.shifts.map(function(s){return '<td style="font-family:var(--sans)">'+esc(s.name||'—')+'</td>';}).join('')+'<td></td></tr>';
  rows.forEach(function(r){
    if(r[0]==='grp'){h+='<tr class="grp"><td colspan="5">'+r[1]+'</td></tr>';return;}
    var key=r[1],isSo=(r[2]||'').indexOf('so')>-1,isGal=(r[2]||'').indexOf('gal')>-1;
    var tot=sum(cs.map(function(c){return c[key];}));
    function f(v){return isGal?fmtOut(v,'gal'):(isSo?soText(v):usd(v));}
    h+='<tr class="'+((r[2]||'').indexOf('key')>-1?'key':'')+'"><td>'+r[0]+'</td>'+
      cs.map(function(c){var cl=isSo?soInfo(c[key],c.has).cls:'';return '<td class="'+cl+'">'+f(c[key])+'</td>';}).join('')+
      '<td class="dayc '+(isSo?soInfo(tot,cs.some(function(c){return c.has;})).cls:'')+'">'+f(tot)+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  $('#main').innerHTML=h;
}

function renderTabs(){
  var h='';
  for(var i=0;i<=N_SHIFTS;i++){
    h+='<button type="button" role="tab" class="tab" id="tab'+i+'" data-tab="'+i+'" aria-selected="'+(state.tab===i)+'"><span>'+(i<N_SHIFTS?'Shift '+(i+1):'Day total')+'</span><span class="tm" id="tm'+i+'"></span></button>';
  }
  $('#tabs').innerHTML=h;
}
function dayCalc(d){
  state.calcDate=d;var cs=state.days[d].shifts.map(calc);state.calcDate=null;
  var so=r2(sum(cs.map(function(c){return c.so;})));
  return {cs:cs,so:so,has:cs.some(function(c){return c.has;}),collected:r2(sum(cs.map(function(c){return c.collected;}))),sales:r2(sum(cs.map(function(c){return c.sales;})))};
}
function updateLive(){
  var dc=dayCalc(state.date);state.cs=dc.cs;
  /* tab minis */
  for(var i=0;i<N_SHIFTS;i++){var el=$('#tm'+i);if(el){var c=dc.cs[i],inf=soInfo(c.so,c.has);el.className='tm '+inf.cls;el.textContent=c.has?soText(c.so):'—';}}
  var te=$('#tm'+N_SHIFTS);if(te){var ti=soInfo(dc.so,dc.has);te.className='tm '+ti.cls;te.textContent=dc.has?soText(dc.so):'—';}
  /* current shift fields */
  if(state.tab<N_SHIFTS){
    var o=dc.cs[state.tab];
    $$('#main [data-o]').forEach(function(el){el.textContent=fmtOut(o[el.dataset.o],el.dataset.f);});
    $$('#main [data-auto]').forEach(function(el){var v=o[el.dataset.auto];el.placeholder=v>0?v.toFixed(2):'0.00';});
    var inf=soInfo(o.so,o.has);
    $$('#main [data-so]').forEach(function(el){el.className='big '+inf.cls;});
    $$('#main [data-pill]').forEach(function(el){el.className='pill '+inf.cls;el.textContent=inf.word;});
  }
  /* bottom bar */
  var isDay=state.tab>=N_SHIFTS,c2=isDay?{so:dc.so,has:dc.has,collected:dc.collected,sales:dc.sales}:dc.cs[state.tab];
  var bi=soInfo(c2.so,c2.has);
  $('#barTitle').textContent=isDay?'Day total':'Shift '+(state.tab+1);
  $('#barSub').textContent='Collected '+usd(c2.collected)+'  ·  Sales '+usd(c2.sales);
  var bn=$('#barNum');bn.className='bn '+bi.cls;bn.textContent=c2.has?soText(c2.so):'—';
  var bp=$('#barPill');bp.className='pill '+bi.cls;bp.textContent=bi.word;
  /* current date chip */
  var chip=$('.chip[data-date="'+state.date+'"] .cs');
  if(chip){chip.className='cs '+(dc.has?soInfo(dc.so,true).cls:'');chip.textContent=dc.has?soText(dc.so):'—';}
}

function visibleDates(){
  return Object.keys(state.days).filter(function(d){
    return d===state.date||state.days[d].added||dayCalc(d).has;
  }).sort().reverse();
}
function renderDates(){
  var box=$('#dates'),sl=box.scrollLeft;
  box.innerHTML=visibleDates().map(function(d){
    var dt=toDate(d),dc=dayCalc(d);
    return '<button type="button" class="chip" data-date="'+d+'" aria-current="'+(d===state.date)+'">'+
      '<span class="cw">'+dt.toLocaleDateString('en-US',{weekday:'short'})+'</span>'+
      '<span class="cd">'+dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})+(dt.getFullYear()!==new Date().getFullYear()?' '+dt.getFullYear():'')+'</span>'+
      '<span class="cs '+(dc.has?soInfo(dc.so,true).cls:'')+'">'+(dc.has?soText(dc.so):'—')+'</span></button>';
  }).join('');
  box.scrollLeft=sl;
  var sel=$('.chip[aria-current="true"]',box);
  if(sel&&sel.scrollIntoView&&!box._seen){box._seen=1;try{sel.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}}
  $('#datePick').value=state.date;
}
function renderAll(){
  renderTabs();
  if(state.tab<N_SHIFTS)renderShift();else renderDay();
  renderDates();updateLive();
  armed=false;var dd=$('#delDay');dd.textContent='Delete this day';dd.classList.remove('armed');
}

/* ---------- navigation ---------- */
function openDate(d,explicit){
  if(!validDate(d))return;
  var isNew=!state.days[d];
  ensureDay(d);
  if(explicit&&!state.days[d].added&&dayCalc(d).has===false){state.days[d].added=true;markDirty(d);}
  state.date=d;renderAll();
  if(isNew&&!explicit){/* not saved until edited */}
}

/* ---------- events ---------- */
var main=$('#main');
main.addEventListener('input',function(e){
  var t=e.target,ds=t.dataset||{};
  if(ds.gp){state.ui.gasDraft[ds.gp]=t.value;return;}
  if(ds.cp){state.ui.costDraft[ds.cp]=t.value;return;}
  if(ds.ty!==undefined){state.ui.typesDraft[Number(ds.ty)]=t.value;return;}
  var p=ds.p;
  if(!p||state.tab>=N_SHIFTS)return;
  setP(cur(),p,t.value);
  var m=/^gas\.(g\d+)\.gal$/.exec(p);
  if(m){var gg=cur().gas[m[1]];
    if(t.value.trim()==='')gg.pr='';
    else if(gg.pr===''&&num(state.settings.gas[m[1]])>0)gg.pr=state.settings.gas[m[1]];}
  markDirty();updateLive();
});
main.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||state.tab>=N_SHIFTS)return;
  var a=b.dataset.act,S=state.settings,U=state.ui;
  if(a==='reset'){
    if(!resetArmed){
      resetArmed=true;b.textContent='Tap again to clear Shift '+(state.tab+1);b.classList.add('armed');
      clearTimeout(resetTimer);resetTimer=setTimeout(function(){resetArmed=false;if(b.isConnected){b.textContent='Reset this shift';b.classList.remove('armed');}},4000);
      return;
    }
    clearTimeout(resetTimer);
    state.days[state.date].shifts[state.tab]=blankShift();
    U.gasEdit=false;U.typesEdit=false;
    markDirty();renderShift();updateLive();renderDates();return;
  }
  if(a==='gas-edit'){U.gasEdit=true;U.gasDraft={g87:S.gas.g87,g89:S.gas.g89,g93:S.gas.g93};renderShift();updateLive();return;}
  if(a==='gas-cancel'){U.gasEdit=false;renderShift();updateLive();return;}
  if(a==='gas-save'){
    var sh=cur();
    GAS.forEach(function(g){
      var v=String(U.gasDraft[g[0]]||'').trim();
      S.gas[g[0]]=num(v)>0?String(num(v)):'';
      sh.gas[g[0]].pr=(sh.gas[g[0]].gal.trim()!==''&&S.gas[g[0]]!=='')?S.gas[g[0]]:'';
    });
    U.gasEdit=false;saveSettings('gas');markDirty();renderShift();updateLive();return;
  }
  if(a==='cost-edit'){if(!state.isOwner)return;U.costEdit=true;U.costDraft={};GAS.forEach(function(g){U.costDraft[g[0]]=costFor(state.date,g[0]);});renderShift();updateLive();return;}
  if(a==='cost-cancel'){U.costEdit=false;renderShift();updateLive();return;}
  if(a==='cost-save'){
    var ent={d:state.date};
    GAS.forEach(function(g){var v=num(U.costDraft[g[0]]);ent[g[0]]=v>0?String(v):'';});
    S.cost=S.cost.filter(function(e){return e.d!==state.date;});S.cost.push(ent);
    S.cost.sort(function(x,y){return x.d<y.d?-1:1;});
    U.costEdit=false;saveSettings('cost');renderShift();updateLive();return;
  }
  if(a==='ty-edit'){if(!state.isOwner)return;U.typesEdit=true;U.typesDraft=S.types.slice();renderShift();updateLive();return;}
  if(a==='ty-cancel'){U.typesEdit=false;renderShift();updateLive();return;}
  if(a==='ty-add'){U.typesDraft.push('');renderShift();updateLive();var ne=document.getElementById('ty-'+(U.typesDraft.length-1));if(ne)ne.focus();return;}
  if(a==='ty-del'){U.typesDraft.splice(Number(b.dataset.i),1);renderShift();updateLive();return;}
  if(a==='ty-save'){
    var seen={},names=[];
    U.typesDraft.forEach(function(n){n=String(n).trim();if(n&&!seen[n.toLowerCase()]){seen[n.toLowerCase()]=1;names.push(n);}});
    S.types=names.length?names:DEFAULT_TYPES.slice();
    U.typesEdit=false;saveSettings('types');renderShift();updateLive();return;
  }
  var l=b.dataset.l,s=cur(),tpl={drops:{t:'',n:'',a:''},payouts:{cat:S.types[0]||'',desc:'',amt:''}};
  var focusId=null;
  if(b.dataset.act==='add'){
    s[l].push(JSON.parse(JSON.stringify(tpl[l])));
    var first={drops:'t',payouts:'desc'}[l];
    focusId=pid(l+'.'+(s[l].length-1)+'.'+first);
  }else{
    var i=Number(b.dataset.i);
    s[l].splice(i,1);
    if(!s[l].length)s[l].push(JSON.parse(JSON.stringify(tpl[l])));
  }
  markDirty();renderShift();updateLive();
  if(focusId){var el=document.getElementById(focusId);if(el)el.focus();}
});
$('#tabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-tab]');if(!b)return;
  state.tab=Number(b.dataset.tab);renderTabs();
  if(state.tab<N_SHIFTS)renderShift();else renderDay();
  updateLive();
  window.scrollTo({top:0});
});
$('#dates').addEventListener('click',function(e){var b=e.target.closest('[data-date]');if(b)openDate(b.dataset.date,false);});
$('#datePick').addEventListener('change',function(e){if(e.target.value)openDate(e.target.value,true);});
$('#todayBtn').addEventListener('click',function(){openDate(todayStr(),true);});
$('#delDay').addEventListener('click',function(){
  var btn=$('#delDay');
  if(!armed){armed=true;btn.textContent='Tap again to delete '+state.date;btn.classList.add('armed');clearTimeout(armTimer);armTimer=setTimeout(function(){armed=false;btn.textContent='Delete this day';btn.classList.remove('armed');},4000);return;}
  var d=state.date;
  delete state.days[d];
  markDirty(d);
  ensureDay(todayStr());state.date=todayStr();
  if(d===state.date){/* deleted today: blank day shown */}
  renderAll();
});

/* ---------- boot ---------- */
function typing(){var a=document.activeElement;return a&&main.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);}
function refreshView(){
  if(state.tab>=N_SHIFTS){renderDay();updateLive();return;}
  if(typing())updateLive();else{renderShift();updateLive();}
}
function startLocal(){
  mode='local';state.isOwner=true;
  try{mergeSettings(JSON.parse(localStorage.getItem(LS_SET)||'null'));}catch(e){}
  var loc=readLocal();
  Object.keys(loc).forEach(function(k){if(validDate(k)&&!dirty[k])state.days[k]=normDay(loc[k]);});
  ensureDay(state.date);
  renderAll();
  setStatus('ok','Saved on this device only');
}
function startDb(db){
  mode='db';dbCol=db.collection('days');dbSet=db.collection('settings');
  var loadTimer=setTimeout(function(){setStatus('warn',"Can't reach saved data yet. Still trying.");},10000);
  dbSet.onSnapshot(function(snap){
    snap.docs.forEach(function(d){
      var v=d.data()||{};
      if(d.id==='payoutTypes')mergeSettings({types:v.names});
      if(d.id==='gas')mergeSettings({gas:v});
      if(d.id==='gasCost')mergeSettings({cost:v.entries});
    });
    if(state.ui.gasEdit||state.ui.typesEdit)updateLive();else refreshView();
  },function(){});
  dbCol.onSnapshot(function(snap){
    clearTimeout(loadTimer);
    var changedCur=false;
    snap.docChanges().forEach(function(ch){
      var id=ch.doc.id;if(!validDate(id))return;
      if(dirty[id]||ch.doc.metadata.hasPendingWrites)return;
      if(ch.type==='removed'){
        if(state.days[id]){delete state.days[id];if(id===state.date){changedCur=true;ensureDay(id);}}
        return;
      }
      var nd=normDay(ch.doc.data()),old=state.days[id];
      if(!old||JSON.stringify(old)!==JSON.stringify(nd)){state.days[id]=nd;if(id===state.date)changedCur=true;}
    });
    ensureDay(state.date);
    renderDates();
    if(changedCur){if(typing())updateLive();else renderAll();}else updateLive();
    if(!Object.keys(dirty).length)setStatus('ok',snap.metadata.fromCache?'Loading saved days…':'Saved');
  },function(err){
    clearTimeout(loadTimer);
    setStatus('warn','Saved data unavailable ('+(err&&err.code||'error')+')');
  });
}
function boot(){
  state.date=todayStr();ensureDay(state.date);
  renderAll();
  setStatus('','Loading…');
  var use=(window.claude&&window.claude.use)?window.claude.use.bind(window.claude):null;
  Promise.resolve(use?use('db'):null).then(function(db){
    if(!db){startLocal();return;}
    startDb(db);
    return Promise.resolve(use('user')).then(function(u){return u?u.isOwner():false;}).then(function(o){
      state.isOwner=!!o;
      if(!state.ui.typesEdit&&!state.ui.gasEdit)refreshView();
    });
  }).catch(function(){if(mode==='init')startLocal();});
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){clearTimeout(saveTimer);flush();}});
window.addEventListener('pagehide',function(){clearTimeout(saveTimer);flush();});
boot();
})();
</script>

</body></html>
