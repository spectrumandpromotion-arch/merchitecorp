<title>Gas Station Shift Sheet</title>

<style>
/* Layout: one working column of cards per shift under a sticky tab bar; the result card leads, a fixed bottom bar keeps short/over in view. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#14202B; --muted:#586979; --line:#D3DBE2;
  --accent:#0B6B5D; --accent-ink:#FFFFFF; --accent-soft:#DDF0EC;
  --short:#B3261E; --short-soft:#FBE5E3; --over:#1F5FA8; --over-soft:#E2EDF9; --ok:#1B7A43; --ok-soft:#DFF1E5;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161C; --surface:#18222B; --surface-2:#1E2A34; --ink:#E7EDF2; --muted:#93A4B3; --line:#2C3A46;
    --accent:#4FC3AE; --accent-ink:#06201B; --accent-soft:#17352F;
    --short:#FF8A80; --short-soft:#3A1E1D; --over:#7DB4F0; --over-soft:#192B40; --ok:#6FD09A; --ok-soft:#173222;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#18222B; --surface-2:#1E2A34; --ink:#E7EDF2; --muted:#93A4B3; --line:#2C3A46;
  --accent:#4FC3AE; --accent-ink:#06201B; --accent-soft:#17352F;
  --short:#FF8A80; --short-soft:#3A1E1D; --over:#7DB4F0; --over-soft:#192B40; --ok:#6FD09A; --ok-soft:#173222;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);
  padding-block:0 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:none;width:100%;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{padding-top:18px;display:grid;gap:12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.status{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.status.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.status.warn{color:var(--short);background:var(--short-soft);border-color:transparent}
.datebar{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.datepick{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
.datepick input{font:500 15px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.btn{padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.danger{color:var(--short)}
.btn.armed{background:var(--short);color:#fff;border-color:var(--short)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.repctl{display:grid;gap:10px}
.repctl .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.repday{width:100%;text-align:left;background:none;border:0;padding:0;font:inherit;color:var(--accent);font-weight:600}
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}

.chip .cd{font-weight:600}
.chip .cs{font:500 12px var(--mono);color:var(--muted)}
.chip[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.cs.short,.tm.short{color:var(--short)} .cs.over,.tm.over{color:var(--over)} .cs.ok,.tm.ok{color:var(--ok)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;background:var(--bg);border-bottom:1px solid var(--line);margin-top:6px}
.tab{flex:1;min-width:0;padding:10px 4px 8px;background:none;border:0;border-bottom:3px solid transparent;display:grid;gap:1px;justify-items:center;font-weight:600}
.tab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--accent)}

main{padding-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}

.x{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted);font-size:18px;line-height:1;padding:0}

.negt{flex:0 0 auto;width:30px;height:30px;margin-right:3px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--muted);font-size:18px;line-height:1;padding:0}
.negt.on{color:var(--short);border-color:var(--short);background:var(--short-soft)}
.add{justify-self:start;padding:6px 10px;border:1px dashed var(--muted);border-radius:6px;background:none;color:var(--accent);font-weight:600;font-size:13px}
.hdr{display:grid;gap:8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:-2px}
.hdr.drop{grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1fr) 32px}
.hdr.who{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 32px}
.hdr span:nth-child(3){text-align:right}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:1px solid var(--line);font-weight:600}
.tot b,.ln b,.mono{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}

.co td.amt{font-weight:600}
.costeps{font-size:12.5px;color:var(--muted);margin:2px 0 12px}

@media (max-width:460px){.coins{grid-template-columns:repeat(2,minmax(0,1fr))}.two.keep{grid-template-columns:repeat(2,minmax(0,1fr))}}
.coin .in input{padding:9px 8px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px 32px}
.ln{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ln span{min-width:0}
.ln.t{border-bottom:0;border-top:1px solid var(--ink);margin-top:2px;padding-top:8px;font-weight:700}
.result{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.rl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font:600 34px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.big.short{color:var(--short)}.big.over{color:var(--over)}.big.ok{color:var(--ok)}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--muted)}
.pill.short{background:var(--short-soft);color:var(--short)}.pill.over{background:var(--over-soft);color:var(--over)}.pill.ok{background:var(--ok-soft);color:var(--ok)}
.note{margin:10px 0 0;font-size:12.5px;color:var(--muted);max-width:70ch}
details{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
summary{cursor:pointer;font-weight:600}
.tk{overflow-x:auto;margin-top:10px}
.tk>div{min-width:330px}
.tr{display:grid;grid-template-columns:26px repeat(2,minmax(0,1fr)) 34px minmax(0,.8fr) 62px;gap:4px;align-items:center;margin-bottom:4px}
.tr.h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tr .n{color:var(--muted);font:500 12px var(--mono);text-align:right;padding-right:2px}
.tr input{width:100%;min-width:0;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);color:inherit;padding:7px 5px;font:500 13.5px var(--mono);text-align:right}
.tr .o{font:500 12.5px var(--mono);text-align:right}
.gas{display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,1fr) 88px;gap:8px;align-items:center}
.gas.h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.gas .g{font:700 16px var(--mono)}

.gas .in input{padding:9px 6px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.cardhead h2{margin:0}
.link{background:none;border:0;padding:2px 0;color:var(--accent);font-weight:600;font-size:13px}
.costbox{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cardhead h3{margin:0}
.link.danger{color:var(--short)}
.link.armed{background:var(--short);color:#fff;padding:3px 8px;border-radius:5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.tyrow{grid-template-columns:minmax(0,1fr) 32px}
.gas .pr{font:500 14px var(--mono);padding:0 4px}
.gas .pr.unset{font-family:var(--sans);color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td{font-family:var(--mono);font-size:14px}
td:first-child{font-family:var(--sans)}
tr.grp td{background:var(--surface-2);font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left}
tr.key td{font-weight:700;border-top:1px solid var(--ink)}
td.short{color:var(--short)}td.over{color:var(--over)}td.ok{color:var(--ok)}
td.dayc{font-weight:700;background:var(--accent-soft)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
.bar-in{max-width:none;width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bt{font-weight:700;display:block}
.bs{font:500 12px var(--mono);color:var(--muted)}
.bn{font:600 20px var(--mono);margin-right:10px}
.bn.short{color:var(--short)}.bn.over{color:var(--over)}.bn.ok{color:var(--ok)}
.br{display:flex;align-items:center;flex:0 0 auto}
@media (max-width:420px){.bs{display:none}.bn{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){
'use strict';
var N_SHIFTS=3, LOTTERY_SHIFT=2;
/* Cash Out tab: bill and coin denominations for the closing count.
   Bills in dollars, coins in cents — the $1 coin is in the list. */
var CO_BILLS=[100,50,20,10,5,2,1],CO_COINS=[100,50,25,10,5,1];
function coCounts(s){
  var co=s&&s.cashout?s.cashout:{b:{},c:{}};
  var b={},c={},has=false,bt=0,ct=0;
  CO_BILLS.forEach(function(v){var k=String(v),raw=co.b?co.b[k]:'';var n=num(raw);b[v]=n;if(String(raw==null?'':raw).trim()!=='')has=true;bt+=n*v;});
  CO_COINS.forEach(function(v){var k=String(v),raw=co.c?co.c[k]:'';var n=num(raw);c[v]=n;if(String(raw==null?'':raw).trim()!=='')has=true;ct+=n*v;});
  return {b:b,c:c,has:has,bTotal:r2(bt),cTotal:r2(ct/100)};
}
function coStep(i){return (state.ui.coStep&&state.ui.coStep[i])||1;}
function coSetStep(i,n){if(!state.ui.coStep)state.ui.coStep={};state.ui.coStep[i]=n;}
var GAS=[['g87','87'],['g89','89'],['g93','93']];
var DEFAULT_TYPES=['Lottery','Western Union','Vendor','Other'];
var LS_SET='gas-shift-sheet-settings-v1';
var LS_KEY='gas-shift-sheet-v1';

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(String(v==null?'':v).replace(/[$,\s]/g,''));return isFinite(n)?n:0;}
function r2(x){return Math.round((x+1e-9)*100)/100;}
function sum(a){return a.reduce(function(t,x){return t+x;},0);}
function usd(x){var v=r2(x);var s=Math.abs(v).toLocaleString('en-US',{style:'currency',currency:'USD'});return v<0?'−'+s:s;}
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function toDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(toDate(s).getTime());}

/* ---------- data model ---------- */
function blankShift(){
  return {name:'',drops:[{t:'',n:'',a:''}],bills:'',coins:{q:'',d:'',n:'',p:''},
    cashout:{b:{'100':'','50':'','20':'','10':'','5':'','2':'','1':''},c:{'100':'','50':'','25':'','10':'','5':'','1':''},by:'',comment:'',confirmedBy:'',confirmedAt:''},
    credit:'',debit:'',ebt:'',coupons:'',fees:'',
    payouts:[{cat:state.settings.types[0]||'',desc:'',amt:''}],
    fuel:'',merch:'',tax:'',
    lotI:'',lotO:'',lotC:'',
    gas:{g87:{gal:'',pr:''},g89:{gal:'',pr:''},g93:{gal:'',pr:''}}};
}
function norm(src,base){
  if(Array.isArray(base)){
    if(!Array.isArray(src)||!src.length)return base;
    return src.map(function(x){return norm(x,base[0]);});
  }
  if(base&&typeof base==='object'){
    var out={},s=(src&&typeof src==='object')?src:{};
    Object.keys(base).forEach(function(k){out[k]=norm(s[k],base[k]);});
    return out;
  }
  return (typeof src==='string'||typeof src==='number')?String(src):base;
}
function normShift(s){return norm(s,blankShift());}
function normDay(d){
  var sh=[];for(var i=0;i<N_SHIFTS;i++)sh.push(normShift(d&&d.shifts?d.shifts[i]:null));
  return {shifts:sh,added:!!(d&&d.added)};
}

/* ---------- calculations ---------- */
function calc(s,idx){
  var o={},T0=state.settings.types[0]||'';
  o.dropsT=r2(sum(s.drops.map(function(d){return num(d.a);})));
  /* Drawer cash: the Cash Out tab count wins when any count was entered;
     otherwise fall back to the old bills amount + coin counts, so shifts
     entered before the Cash Out tab keep their totals. */
  var co=coCounts(s);
  o.coHas=co.has;o.coBills=co.bTotal;o.coCoins=co.cTotal;o.coB=co.b;o.coC=co.c;
  if(co.has){o.bills=co.bTotal;o.coins=co.cTotal;}
  else{
    o.bills=num(s.bills);
    var q=num(s.coins.q),d=num(s.coins.d),n=num(s.coins.n),p=num(s.coins.p);
    o.coins=(q*25+d*10+n*5+p)/100;
  }
  o.drawer=r2(o.bills+o.coins);
  o.cash=r2(o.dropsT+o.bills+o.coins);
  o.credit=num(s.credit);o.debit=num(s.debit);o.ebt=num(s.ebt);o.coupons=num(s.coupons);o.fees=num(s.fees);
  o.cards=r2(o.credit+o.debit);o.cardsNet=r2(o.cards-o.fees);
  o.payT=r2(sum(s.payouts.map(function(x){return num(x.amt);})));
  o.payLot=r2(sum(s.payouts.filter(function(x){return /lottery/i.test(x.cat||T0);}).map(function(x){return num(x.amt);})));
  o.collected=r2(o.cash+o.credit+o.debit+o.ebt+o.coupons+o.payT);
  var isLot=(idx===LOTTERY_SHIFT);
  var gasAmt=0,gasGal=0,gp=state.settings.gas;
  var profT=0,cd_=state.calcDate||state.date;
  GAS.forEach(function(g){var r=s.gas[g[0]];var gl=isLot?num(r.gal):0,pr=r.pr!==''?num(r.pr):num(gp[g[0]]);var cost=num(costFor(cd_,g[0]));o[g[0]]=r2(gl*pr);o[g[0]+'g']=gl;o[g[0]+'m']=cost>0?(pr-cost):0;o[g[0]+'p']=r2(cost>0?gl*(pr-cost):0);profT+=(cost>0?gl*(pr-cost):0);gasAmt+=gl*pr;gasGal+=gl;});
  o.gasAmt=r2(gasAmt);o.gasGal=gasGal;o.gasProfit=r2(profT);
  o.fuelAuto=o.gasAmt;
  o.fuel=s.fuel.trim()!==''?num(s.fuel):o.gasAmt;
  o.merch=num(s.merch);o.tax=num(s.tax);
  o.lotI=isLot?num(s.lotI):0;
  o.lotO=isLot?num(s.lotO):0;
  o.lotC=isLot?num(s.lotC):0;
  o.lotSales=r2(o.lotI+o.lotO+o.lotC);
  o.lotNet=r2(o.lotSales-o.payLot);
  o.sales=r2(o.fuel+o.merch+o.tax+o.lotSales);
  o.so=r2(o.collected-o.sales);
  o.has=(o.collected!==0||o.sales!==0||s.name.trim()!=='');
  return o;
}
function soInfo(x,has){
  if(!has)return {cls:'',word:'No entries'};
  if(Math.abs(x)<0.005)return {cls:'ok',word:'Balanced'};
  return x<0?{cls:'short',word:'Short'}:{cls:'over',word:'Over'};
}
function soText(x){var v=r2(x);return (v>0?'+':'')+usd(v);}
function fmtOut(v,f){
  v=v||0;
  if(f==='n')return String(v);
  if(f==='gal')return String(Number(v.toFixed(3)));
  if(f==='so')return soText(v);
  if(f==='m')return v?((v<0?'\u2212':'')+'$'+Math.abs(v).toFixed(3)):'\u2014';
  return usd(v);
}

/* ---------- sync to Google Sheet (Uptown Shell - Shift Sheet Sync) ---------- */
var SYNC_URL='https://script.google.com/macros/s/AKfycbxjongQ5prQyIv9lP4kv-55cpiWcQhxikBVcuCpWC2s7ij7GTHDmn0Q_cohPZQtqy5_Cg/exec';
function syncShift(date, idx){
  try{
    var day=state.days[date]; if(!day) return Promise.resolve(false);
    var sh=day.shifts[idx]; var c=calc(sh, idx);
    if(!c.has) return Promise.resolve(false);
    var payload={
      date: date, shift: idx+1, cashier: sh.name||'',
      cash: c.cash, dropsTotal: c.dropsT, credit: c.credit, debit: c.debit,
      ebt: c.ebt, coupons: c.coupons, fees: c.fees,
      payOutsTotal: c.payT,
      payOutsDetail: sh.payouts.map(function(x){return (x.cat||'')+': '+(x.desc||'')+' $'+num(x.amt);}).join('; '),
      fuelSales: c.fuel, merchSales: c.merch, tax: c.tax, lotterySales: c.lotSales, lotteryCash: c.lotC,
      totalSales: c.sales, collected: c.collected, shortOver: c.so,
      gas87gal: c.g87g, gas89gal: c.g89g, gas93gal: c.g93g, gasSales: c.gasAmt,
      gasProfit: c.gasProfit, gas87profit: c.g87p, gas89profit: c.g89p, gas93profit: c.g93p,
      cashout: c.coHas?{bills:c.coB,coins:c.coC,billsTotal:c.coBills,coinsTotal:c.coCoins,drawerTotal:c.drawer,by:String(sh.cashout.by||''),comment:String(sh.cashout.comment||''),confirmedBy:String(sh.cashout.confirmedBy||''),confirmedAt:String(sh.cashout.confirmedAt||''),has:true}:null
    };
    return fetch(SYNC_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload)})
      .then(function(){ return true; }).catch(function(){ return false; });
  }catch(e){ return Promise.resolve(false); }
}
function syncDay(date){
  var ps=[]; for(var i=0;i<N_SHIFTS;i++) ps.push(syncShift(date,i));
  return Promise.all(ps).then(function(rs){ return rs.some(function(x){return x;}); });
}

/* ---------- manual upload + delete (sheets only change on purpose) ---------- */
var LS_UP='gas-shift-sheet-uploaded-v1';
function readUploaded(){try{var m=JSON.parse(localStorage.getItem(LS_UP)||'{}');return m&&typeof m==='object'?m:{};}catch(e){return {};}}
function markUploaded(d){try{var m=readUploaded();m[d]=new Date().toISOString();localStorage.setItem(LS_UP,JSON.stringify(m));}catch(e){}}
function clearUploaded(d){try{var m=readUploaded();delete m[d];localStorage.setItem(LS_UP,JSON.stringify(m));}catch(e){}}
function uploadedAt(d){return readUploaded()[d]||'';}
function fmtUpTime(iso){try{return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
function deleteDateFromSheets(d){
  try{
    return fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'delete',date:d})}).then(function(){return true;}).catch(function(){return false;});
  }catch(e){return Promise.resolve(false);}
}
function doDeleteDate(d){
  if(!validDate(d))return;
  var wasOpen=(d===state.date);
  delete state.days[d];clearUploaded(d);markDirty(d);
  setStatus('','Deleting '+fmtDay(d)+' from website and sheets…');
  deleteDateFromSheets(d).then(function(ok){
    if(ok)setStatus('ok','Deleted '+fmtDay(d)+' from website and sheets.');
    else setStatus('warn','Deleted from this device, but the sheet delete did not go through — check connection and delete the date again.');
  });
  if(wasOpen){ensureDay(todayStr());state.date=todayStr();}
  renderAll();
}

function setStatus(kind,text){var el=$('#status');el.className='status'+(kind?' '+kind:'');el.textContent=text;}
function readLocal(){try{var raw=localStorage.getItem(LS_KEY);return raw?JSON.parse(raw):{};}catch(e){return {};}}
function writeLocal(){try{
  var out={};Object.keys(state.days).forEach(function(k){out[k]=state.days[k];});
  localStorage.setItem(LS_KEY,JSON.stringify(out));return true;}catch(e){return false;}}
function markDirty(d){
  d=d||state.date;dirty[d]=true;ver[d]=(ver[d]||0)+1;
  setStatus('','Saving…');
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
function flush(){
  if(saving){saveTimer=setTimeout(flush,300);return;}
  var keys=Object.keys(dirty);
  if(!keys.length)return;
  saving=true;
  var chain=Promise.resolve(),failed=null;
  keys.forEach(function(d){
    chain=chain.then(function(){
      var v=ver[d],day=state.days[d];
      var op;
      if(mode==='db'){
        op=day?dbCol.doc(d).set({shifts:day.shifts,added:!!day.added,savedAt:Date.now()}):dbCol.doc(d).delete();
      }else{
        op=Promise.resolve(writeLocal()?null:Promise.reject({message:'storage'}));
      }
      return op.then(function(){if(ver[d]===v)delete dirty[d];});
    }).catch(function(e){failed=e;});
  });
  chain.then(function(){
    saving=false;
    if(failed){setStatus('warn',"Couldn't save. You may have view-only access.");}
    else if(Object.keys(dirty).length){saveTimer=setTimeout(flush,300);}
    else setStatus('ok',mode==='db'?'Saved':'Saved on this device only — tap Upload to Sheets to send it to the reports');
  });
}

function saveSettings(which){
  if(mode==='db'&&dbSet){
    var g=state.settings.gas;
    var data=which==='types'?{names:state.settings.types}:which==='cost'?{entries:state.settings.cost}:{g87:g.g87,g89:g.g89,g93:g.g93};
    setStatus('','Saving…');
    dbSet.doc(which==='types'?'payoutTypes':which==='cost'?'gasCost':'gas').set(data).then(function(){setStatus('ok','Saved');},function(){
      setStatus('warn',which==='types'?"Couldn't save names. Only the owner can change them.":which==='cost'?"Couldn't save cost. Only the owner can change it.":"Couldn't save prices.");});
  }else{
    try{localStorage.setItem(LS_SET,JSON.stringify(state.settings));setStatus('ok','Saved on this device only');}
    catch(e){setStatus('warn',"Couldn't save.");}
  }
}
function mergeSettings(src){
  if(!src||typeof src!=='object')return;
  if(Array.isArray(src.cost)){
    state.settings.cost=src.cost.filter(function(e){return e&&typeof e.d==='string'&&validDate(e.d);}).map(function(e){
      return {d:e.d,g87:String(e.g87||''),g89:String(e.g89||''),g93:String(e.g93||'')};});
  }
  if(Array.isArray(src.types)){
    var t=src.types.filter(function(x){return typeof x==='string'&&x.trim();});
    if(t.length)state.settings.types=t;
  }
  if(src.gas&&typeof src.gas==='object')GAS.forEach(function(g){
    var v=src.gas[g[0]];if(typeof v==='string'||typeof v==='number')state.settings.gas[g[0]]=String(v);});
}
function costFor(d,k){var best=null;state.settings.cost.forEach(function(e){if(e.d<=d&&(!best||e.d>best.d))best=e;});return best&&num(best[k])>0?best[k]:'';}
function costSince(d){var best=null;state.settings.cost.forEach(function(e){if(e.d<=d&&(!best||e.d>best.d))best=e;});return best?best.d:'';}
function fmtDay(d){return toDate(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function priceOf(s,k){return s.gas[k].pr!==''?s.gas[k].pr:state.settings.gas[k];}

function weekStartStr(d){var dt=toDate(d);var dow=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-dow);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
function addDaysStr(d,n){var dt=toDate(d);dt.setDate(dt.getDate()+n);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
function fmtDayLong(d){return toDate(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});}
function repCalc(d,idx){state.calcDate=d;var c=calc(state.days[d].shifts[idx],idx);state.calcDate=null;return c;}
function repDay(d){
  if(!state.days[d])return null;
  state.calcDate=d;var cs=state.days[d].shifts.map(calc);state.calcDate=null;
  return {cs:cs,has:cs.some(function(c){return c.has;}),collected:r2(sum(cs.map(function(c){return c.collected;}))),sales:r2(sum(cs.map(function(c){return c.sales;}))),so:r2(sum(cs.map(function(c){return c.so;})))};

function repRows(list){

function payeeTotals(list){
  var map={},order=[];
  list.forEach(function(it){
    var day=state.days[it.d];if(!day)return;
    day.shifts[it.idx].payouts.forEach(function(x){
      var amt=num(x.amt);if(!amt)return;
      var who=(x.desc||'').trim()||'Unspecified',key=who+''+(x.cat||'');
      if(!map[key]){map[key]={who:who,cat:x.cat||'',total:0,n:0};order.push(key);}
      map[key].total=r2(map[key].total+amt);map[key].n++;
    });
  });
  return order.map(function(k){return map[k];}).sort(function(a,b){return b.total-a.total;});
}

      tot.cash=r2(tot.cash+sum(rd.cs.map(function(c){return c.cash;})));
      tot.cards=r2(tot.cards+sum(rd.cs.map(function(c){return c.cards;})));
      tot.ebt=r2(tot.ebt+sum(rd.cs.map(function(c){return c.ebt;})));

      tot.gasGal=tot.gasGal+sum(rd.cs.map(function(c){return c.gasGal;}));
      tot.gas=r2(tot.gas+sum(rd.cs.map(function(c){return c.fuel;})));
      tot.merch=r2(tot.merch+sum(rd.cs.map(function(c){return c.merch;})));

function settledPill(debit,credit){
  var d=r2(debit-credit);
  if(Math.abs(d)<0.005)return '<span class="pill ok">Settled</span>';
  return '<span class="pill short">Open '+usd(Math.abs(d))+'</span>';
}

var DREP_SHIFT_LABELS=['1st Shift','2nd Shift','3rd Shift'];
var DREP_LS='gas-shift-sheet-daily-reports-v1';
function drepNormDate(s){
  var t=String(s||'').trim();
  var m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  return '';
}
function drepRows(){var j=state.drepData;if(!j||!j.dailyClosing)return [];return j.dailyClosing.slice(1);}
function drepShiftRow(d,idx){
  var rows=drepRows();
  for(var i=0;i<rows.length;i++){var r=rows[i];if(drepNormDate(r[0])===d&&String(r[1]||'').indexOf(DREP_SHIFT_LABELS[idx])===0)return r;}
  return null;
}
function drepCell(r,i){if(!r)return '';var v=r[i];return v==null?'':String(v);}
function drepHasShiftSheet(r){if(!r)return false;for(var i=21;i<=37;i++){if(String(r[i]||'').trim()!=='')return true;}return false;}
function drepFetch_(ms){
  if(typeof AbortController!=='undefined'){
    var ctl=new AbortController();
    var t=setTimeout(function(){try{ctl.abort();}catch(e){}},ms);
    return fetch(SYNC_URL+'?action=reports',{signal:ctl.signal}).then(function(res){clearTimeout(t);return res.json();});
  }
  return fetch(SYNC_URL+'?action=reports').then(function(res){return res.json();});
}
function drepLoad(force){
  var D=state.drep;
  if(D.loading)return;
  if(!force&&state.drepData){D.loaded=true;return;}
  D.loading=true;D.error='';
  if(state.tab===N_SHIFTS+2)renderDailyReports();
  drepFetch_(30000).then(function(j){
    D.loading=false;
    if(!j||!j.ok||!j.dailyClosing)throw new Error('bad response');
    state.drepData=j;D.loaded=true;D.error='';D.updated=j.generatedAt||new Date().toISOString();
    try{localStorage.setItem(DREP_LS,JSON.stringify({at:D.updated,data:j}));}catch(e){}
    if(state.tab===N_SHIFTS+2){renderDailyReports();updateLive();}
    else if(state.tab===N_SHIFTS+1){renderReports();updateLive();}
  }).catch(function(){
    D.loading=false;
    var cached=null;
    try{cached=JSON.parse(localStorage.getItem(DREP_LS)||'null');}catch(e){}
    if(cached&&cached.data){state.drepData=cached.data;D.loaded=true;D.updated=cached.at;D.error='Showing the saved copy from '+fmtUpTime(cached.at)+' — could not reach the sheets.';}
    else D.error='Could not load the daily reports — check connection and tap Refresh.';
    if(state.tab===N_SHIFTS+2){renderDailyReports();updateLive();}
    else if(state.tab===N_SHIFTS+1){renderReports();updateLive();}
  });
}

var VEND_LS='gas-vendors-manual-v1';

}

  try{localStorage.setItem(VEND_LS,JSON.stringify(vendList));}catch(e){}
}
function vendId(){return 'v'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);}
function vendNorm(x){
  return {id:x.id||vendId(),date:x.date,vendor:String(x.vendor||'').trim(),type:String(x.type||'Vendor').trim()||'Vendor',debit:r2(num(x.debit)),credit:r2(num(x.credit))};

function vendAdd(x){

}
function vendUpdate(id,x){
  var e=null;
  vendList.forEach(function(v){if(v.id===id)e=v;});
  if(!e)return false;

}
function vendDelete(id){

}
function vendRename(oldName,newName){
  var o=String(oldName||'').trim(),n=String(newName||'').trim();

function vendDayItems(d){

  return {items:items,total:total,has:items.length>0};

function vendWeekItems(ws){

function coDay(d){
  var dc=dayCalc(d),out=[];
  for(var i=0;i<N_SHIFTS;i++){
    var s=state.days[d].shifts[i],c=dc.cs[i],co=coCounts(s);
    var legacy=num(s.bills)!==0||num(s.coins.q)||num(s.coins.d)||num(s.coins.n)||num(s.coins.p);
    out.push({i:i,s:s,c:c,co:co,legacy:legacy,counted:co.has||legacy,
      drawer:c.drawer,drops:c.dropsT,cash:c.cash,payT:c.payT,
      exp:r2(c.cash-c.payT-300),so:c.so,has:c.has});

/* ---------- settlement tab (daily cash / bank settlement — manual, on this device only) ---------- */
var STL_LS='gas-settlement-v1';
var STL_PAY_TYPES=['Cash','Card','Bank transfer','Other'];
var stlStore={envelopes:[],days:{}};
function stlLoad(){
  var o=null;
  try{o=JSON.parse(localStorage.getItem(STL_LS)||'null');if(o&&typeof o==='object')stlStore=o;}catch(e){o=null;}
  if(!Array.isArray(stlStore.envelopes))stlStore.envelopes=[];
  if(!stlStore.days||typeof stlStore.days!=='object')stlStore.days={};
  if(!stlStore.envelopes.length&&!(o&&Array.isArray(o.envelopes))){
    stlStore.envelopes=[{id:'e1',name:'Envelope 1'},{id:'e2',name:'Envelope 2'},{id:'e3',name:'Envelope 3'}];
    stlSave();
  }
  stlStore.envelopes=stlStore.envelopes.filter(function(x){return x&&x.id&&String(x.name||'').trim();});
}
function stlSave(){try{localStorage.setItem(STL_LS,JSON.stringify(stlStore));}catch(e){}}
function stlId(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);}
function stlDay(d){
  if(!stlStore.days[d])stlStore.days[d]={cashOverride:['','',''],envAmt:{},payments:[]};
  var r=stlStore.days[d];
  if(!Array.isArray(r.cashOverride))r.cashOverride=['','',''];
  while(r.cashOverride.length<N_SHIFTS)r.cashOverride.push('');
  if(!r.envAmt||typeof r.envAmt!=='object')r.envAmt={};
  if(!Array.isArray(r.payments))r.payments=[];
  return r;
}
function stlPayNorm(x){
  return {id:x.id||stlId('p'),who:String(x.who||'').trim(),type:STL_PAY_TYPES.indexOf(x.type)>=0?x.type:'Cash',debit:r2(num(x.debit)),credit:r2(num(x.credit))};
}
function stlShiftTotals(d){
  var day=state.days[d],dc=day?dayCalc(d):null,rec=stlDay(d);
  var shifts=[],tot={cash:0,cards:0,sales:0,payT:0,expDep:0,has:false};
  for(var i=0;i<N_SHIFTS;i++){
    var c=dc?dc.cs[i]:null;
    var auto=c?c.cash:0;
    var ov=String(rec.cashOverride[i]==null?'':rec.cashOverride[i]).trim();
    var has=(c&&c.has)||ov!=='';
    var cash=ov!==''?num(ov):auto;
    var cards=c?c.cards:0,sales=c?c.sales:0,payT=c?c.payT:0;
    var exp=has?r2(cash-payT-300):0;
    shifts.push({i:i,auto:r2(auto),manual:ov!=='',cash:r2(cash),cards:r2(cards),sales:r2(sales),payT:r2(payT),exp:exp,has:has});
    if(has){tot.cash=r2(tot.cash+cash);tot.cards=r2(tot.cards+cards);tot.sales=r2(tot.sales+sales);tot.payT=r2(tot.payT+payT);tot.expDep=r2(tot.expDep+exp);tot.has=true;}
  }
  var envT=0;stlStore.envelopes.forEach(function(e){envT=r2(envT+num(rec.envAmt[e.id]));});
  var payD=0,payC=0,settledN=0;rec.payments.forEach(function(p){payD=r2(payD+p.debit);payC=r2(payC+p.credit);if(Math.abs(p.debit-p.credit)<0.005)settledN++;});
  tot.envT=envT;tot.payD=payD;tot.payC=payC;tot.payN=rec.payments.length;tot.settledN=settledN;tot.unalloc=r2(tot.expDep-envT);
  return {shifts:shifts,tot:tot,rec:rec};
}
function stlWork(s){return usd(s.cash)+' \u2212 '+usd(s.payT)+' \u2212 $300.00';}
function stlTotals(){
  var d=state.stl.date||state.date;if(!validDate(d))return;
  var T=stlShiftTotals(d),tot=T.tot,map={};
  T.shifts.forEach(function(s){
    map['cash'+s.i]=s.has?usd(s.cash):'\u2014';
    map['exp'+s.i]=s.has?usd(s.exp):'\u2014';
    map['work'+s.i]=s.has?stlWork(s):'no entries yet';
  });

  return {cs:cs,so:so,has:cs.some(function(c){return c.has;}),collected:r2(sum(cs.map(function(c){return c.collected;}))),sales:r2(sum(cs.map(function(c){return c.sales;})))};
}

function openDate(d,explicit){
  if(!validDate(d))return;
  var isNew=!state.days[d];
  ensureDay(d);
  if(explicit&&!state.days[d].added&&dayCalc(d).has===false){state.days[d].added=true;markDirty(d);}
  state.date=d;renderAll();
  if(isNew&&!explicit){/* not saved until edited */}
}

  }

    var sh2=state.days[state.date].shifts[Number(ds.i)];

main.addEventListener('click',function(e){
  var b=e.target.closest('button[data-co]');if(!b||state.tab!==N_SHIFTS+5)return;
  var k=b.dataset.co,i=Number(b.dataset.i||0);
  if(k==='prev-day'){state.date=addDaysStr(state.date,-1);ensureDay(state.date);renderCashOut();renderDates();updateLive();return;}
  if(k==='next-day'){state.date=addDaysStr(state.date,1);ensureDay(state.date);renderCashOut();renderDates();updateLive();return;}
  if(k==='today'){state.date=todayStr();ensureDay(state.date);renderCashOut();renderDates();updateLive();return;}
  if(k==='goto-shift'){state.tab=i;renderTabs();renderShift();updateLive();window.scrollTo({top:0});return;}
  if(k==='step'){coSetStep(i,Number(b.dataset.to||1));renderCashOut();updateLive();return;}
  if(k==='confirm'){
    var sh=state.days[state.date].shifts[i],co=coCounts(sh);
    if(!co.has){setStatus('warn','Count the bills and coins first.');return;}
    var by=String(sh.cashout.by||'').trim();
    sh.cashout.confirmedBy=by;sh.cashout.confirmedAt=new Date().toISOString();
    markDirty();renderCashOut();updateLive();
    setStatus('ok','Shift '+(i+1)+' cash-out confirmed'+(by?' by '+by:'')+' — tap Upload to Sheets to send it to the reports.');
    return;
  }
  if(k==='unconfirm'){
    var sh2=state.days[state.date].shifts[i];
    sh2.cashout.confirmedBy='';sh2.cashout.confirmedAt='';
    markDirty();renderCashOut();updateLive();return;
  }
});

function typing(){var a=document.activeElement;return a&&main.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);}
function refreshView(){
  if(state.tab===N_SHIFTS){renderDay();updateLive();return;}
  if(state.tab===N_SHIFTS+1){renderReports();updateLive();return;}
  if(state.tab===N_SHIFTS+2){renderDailyReports();updateLive();return;}
  if(state.tab===N_SHIFTS+3){renderVendors();updateLive();return;}
  if(state.tab===N_SHIFTS+4){renderSettlement();updateLive();return;}
  if(state.tab===N_SHIFTS+5){renderCashOut();updateLive();return;}
  if(typing())updateLive();else{renderShift();updateLive();}
}
function startLocal(){
  mode='local';state.isOwner=true;
  try{mergeSettings(JSON.parse(localStorage.getItem(LS_SET)||'null'));}catch(e){}
  var loc=readLocal();
  Object.keys(loc).forEach(function(k){if(validDate(k)&&!dirty[k])state.days[k]=normDay(loc[k]);});
  ensureDay(state.date);
  renderAll();
  setStatus('ok','Saved on this device only');
}
function startDb(db){
  mode='db';dbCol=db.collection('days');dbSet=db.collection('settings');
  var loadTimer=setTimeout(function(){setStatus('warn',"Can't reach saved data yet. Still trying.");},10000);
  dbSet.onSnapshot(function(snap){
    snap.docs.forEach(function(d){
      var v=d.data()||{};
      if(d.id==='payoutTypes')mergeSettings({types:v.names});
      if(d.id==='gas')mergeSettings({gas:v});
      if(d.id==='gasCost')mergeSettings({cost:v.entries});
    });
    if(state.ui.gasEdit||state.ui.typesEdit)updateLive();else refreshView();
  },function(){});
  dbCol.onSnapshot(function(snap){
    clearTimeout(loadTimer);
    var changedCur=false;
    snap.docChanges().forEach(function(ch){
      var id=ch.doc.id;if(!validDate(id))return;
      if(dirty[id]||ch.doc.metadata.hasPendingWrites)return;
      if(ch.type==='removed'){
        if(state.days[id]){delete state.days[id];if(id===state.date){changedCur=true;ensureDay(id);}}
        return;
      }
      var nd=normDay(ch.doc.data()),old=state.days[id];
      if(!old||JSON.stringify(old)!==JSON.stringify(nd)){state.days[id]=nd;if(id===state.date)changedCur=true;}
    });
    ensureDay(state.date);
    renderDates();
    if(changedCur){if(typing())updateLive();else renderAll();}else updateLive();
    if(!Object.keys(dirty).length)setStatus('ok',snap.metadata.fromCache?'Loading saved days…':'Saved');
  },function(err){
    clearTimeout(loadTimer);
    setStatus('warn','Saved data unavailable ('+(err&&err.code||'error')+')');
  });
}
function boot(){
  state.date=todayStr();ensureDay(state.date);
  vendLoad();stlLoad();
  var h=location.hash||'';
  if(h==='#reports')state.tab=N_SHIFTS+1;
  else if(h==='#daily-reports')state.tab=N_SHIFTS+2;
  else if(h==='#vendors')state.tab=N_SHIFTS+3;
  else if(h==='#settlement')state.tab=N_SHIFTS+4;
  else if(h==='#cash-out')state.tab=N_SHIFTS+5;
  renderAll();
  if(state.tab===N_SHIFTS+2)drepLoad(false);
  setStatus('','Loading…');
  var use=(window.claude&&window.claude.use)?window.claude.use.bind(window.claude):null;
  Promise.resolve(use?use('db'):null).then(function(db){
    if(!db){startLocal();return;}
    startDb(db);
    return Promise.resolve(use('user')).then(function(u){return u?u.isOwner():false;}).then(function(o){
      state.isOwner=!!o;
      if(!state.ui.typesEdit&&!state.ui.gasEdit)refreshView();
    });
  }).catch(function(){if(mode==='init')startLocal();});
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){clearTimeout(saveTimer);flush();}});
window.addEventListener('pagehide',function(){clearTimeout(saveTimer);flush();});
boot();
})();

<input type="date" id="askAiDate">
<div class="ask-ai-qs" id="askAiQs"></div>
<div class="ask-ai-askrow"><input id="askAiInput" type="text" autocomplete="off" placeholder="Ask about the system data&hellip;"><button class="btn" id="askAiSend" type="button">Ask</button></div>
<div class="ask-ai-answer" id="askAiAnswer" hidden></div>
<p class="ask-ai-src" id="askAiSrc"></p>
</div>
</div>
</main>
<button class="ask-genie-fab" id="askAiBtn" type="button" aria-controls="askAiPanel" aria-label="Ask GENIE"><span class="ask-genie-star" aria-hidden="true">&#10022;</span><span class="ask-genie-label">Ask GENIE</span></button>
<script>
/* Ask AI — NO AI KEY, NO AI SERVICE. Rule-based answers only, computed in
   this browser from the closing-report sheets via the same reports feed the
   profit tool uses (?action=reports). If a number is not in the feed, the
   answer says so — it never invents a number. Profit = qty x (sell - buy)
   using the buy/sell prices saved on this device; categories with no buy
   price set cannot have profit calculated, and the answer says that. */
(function(){
  var sess=null; try{ sess=JSON.parse(sessionStorage.getItem('merchitecorp_session')||'null'); }catch(e){}
  var btn=document.getElementById('askAiBtn'), panel=document.getElementById('askAiPanel');
  if(!btn||!panel) return;
  if(!sess||!sess.email){ btn.style.display='none'; return; }
  var SYNC_URL='https://script.google.com/macros/s/AKfycbxjongQ5prQyIv9lP4kv-55cpiWcQhxikBVcuCpWC2s7ij7GTHDmn0Q_cohPZQtqy5_Cg/exec';
  var DREP_LS='gas-shift-sheet-daily-reports-v1';
  var LS_SET='gas-shift-sheet-settings-v1';
  var CATS=['Beer','Cigarettes','Juice','Snacks & Chips','Tobacco','Water','Misc. No Tax','Energy Drinks','Wine','Soda','Smokeless Tobacco / Chew','Dairy Product','Candy','Gen Grocery','Phone Cards','TX Groc','Frozen Pro','Coffee','Cigars'];
  var CATKEYS=['beer','cigarettes','juice','snack','tobacco','water','misc','energy','wine','soda','smokeless','dairy','candy','grocery','phonecard','txgroc','frozen','coffee','cigars'];
  var SHIFT_LABELS=['1st Shift','2nd Shift','3rd Shift'];
  function num(v){var n=parseFloat(String(v==null?'':v).replace(/[$,\s]/g,''));return isFinite(n)?n:0;}
  function r2(x){return Math.round((x+1e-9)*100)/100;}
  function usd(x){var v=r2(x);var s=Math.abs(v).toLocaleString('en-US',{style:'currency',currency:'USD'});return v<0?'\u2212'+s:s;}
  function pad(n){return (n<10?'0':'')+n;}
  function toDate(s){var p=String(s||'').split('-');return new Date(+p[0],(+p[1]||1)-1,+p[2]||1);}
  function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(toDate(s).getTime());}
  function addDaysStr(d,n){var dt=toDate(d);dt.setDate(dt.getDate()+n);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
  function weekStartStr(d){var dt=toDate(d);var dow=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-dow);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
  function fmtDay(d){return toDate(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
  function fmtUpTime(iso){try{return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
  function normDate(s){
    var t=String(s||'').trim();
    var m=t.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[1]+'-'+m[2]+'-'+m[3];
    m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
    return '';
  }
  function readPrices(){try{var o=JSON.parse(localStorage.getItem(LS_SET)||'null');return (o&&o.profit&&typeof o.profit==='object')?o.profit:{};}catch(e){return {};}}
  function priceByKey(key){
    var p=readPrices()[key]||{}, buy=num(p.buy), sell=0;
    if(p.sellPct!=null){var pct=num(p.sellPct); if(pct>0&&pct<100&&buy>0)sell=r2(buy/(1-pct/100));}
    else sell=num(p.sell);
    return {buy:buy,sell:sell};
  }
  function priceByName(name){ var i=CATS.indexOf(name); return i>=0?priceByKey(CATKEYS[i]):{buy:0,sell:0}; }
  var feed=null, feedUpdated='', feedNote='', feedLoading=false, feedWaiters=[];
  function feedLoad(cb){
    if(feed){ if(cb)cb(true); return; }
    if(cb)feedWaiters.push(cb);
    if(feedLoading) return;
    feedLoading=true;
    fetch(SYNC_URL+'?action=reports').then(function(r){return r.json();}).then(function(j){
      feedLoading=false;
      if(!j||!j.ok||!j.dailyClosing)throw new Error('bad');
      feed=j; feedUpdated=j.generatedAt||''; feedNote='Feed updated '+fmtUpTime(feedUpdated)+'.';
      try{localStorage.setItem(DREP_LS,JSON.stringify({at:feedUpdated,data:j}));}catch(e){}
      var w=feedWaiters; feedWaiters=[]; w.forEach(function(f){f(true);});
    }).catch(function(){
      feedLoading=false;
      var cached=null; try{cached=JSON.parse(localStorage.getItem(DREP_LS)||'null');}catch(e){}
      if(cached&&cached.data){feed=cached.data; feedUpdated=cached.at||''; feedNote='Showing the saved copy from '+fmtUpTime(cached.at)+' — could not reach the sheets.';}
      else feedNote='Could not load the sheets — check connection and try again.';
      var w=feedWaiters; feedWaiters=[]; w.forEach(function(f){f(!!feed);});
    });
  }
  function dailyRows(){
    if(!feed||!feed.dailyClosing) return [];
    return feed.dailyClosing.slice(1).filter(function(r){
      if(!r) return false;
      var d0=String(r[0]||'');
      if(!d0||d0==='Date') return false;
      if(d0.indexOf('CUSTOM')===0) return false;
      if(String(r[1]||'').indexOf('Custom Period')>=0) return false;
      return normDate(r[0])!=='';
    });
  }
  function rowsForDate(d){ return dailyRows().filter(function(r){return normDate(r[0])===d;}); }
  function rowsForWeek(d){
    var ws=weekStartStr(d), we=addDaysStr(ws,6);
    return dailyRows().filter(function(r){var rd=normDate(r[0]); return rd>=ws&&rd<=we;});
  }
  function sumIdx(rows,i){var t=0; rows.forEach(function(r){t=r2(t+num(r[i]));}); return t;}
  function deptRows(){
    if(!feed||!feed.departmentSales) return [];
    return feed.departmentSales.slice(1).filter(function(r){
      if(!r) return false;
      var sh=Number(r[1]); if(!(sh>=1&&sh<=3)) return false;
      return normDate(r[0])!=='';
    });
  }
  function deptForDate(d){ return deptRows().filter(function(r){return normDate(r[0])===d;}); }
  function deptDates(){ var seen={}, out=[]; deptRows().forEach(function(r){var d=normDate(r[0]); if(!seen[d]){seen[d]=1; out.push(d);}}); return out.sort(); }
  function profitForRows(drows){
    var tot={qty:0,sales:0,profit:0,priced:0,unpriced:[],lines:[]};
    if(!drows.length) return null;
    drows.forEach(function(r){
      var sh=Number(r[1]);
      CATS.forEach(function(name,ci){
        var q=num(r[2+ci]); if(q<=0) return;
        var pr=priceByKey(CATKEYS[ci]);
        tot.qty=r2(tot.qty+q);
        if(pr.buy>0&&pr.sell>0){
          tot.sales=r2(tot.sales+q*pr.sell);
          tot.profit=r2(tot.profit+q*(pr.sell-pr.buy));
          tot.priced++;
        } else if(tot.unpriced.indexOf(name)<0){ tot.unpriced.push(name); }
        tot.lines.push({shift:sh,name:name,qty:q,sell:pr.sell,buy:pr.buy});
      });
    });
    return tot;
  }
  function profitForDate(d){ return profitForRows(deptForDate(d)); }
  function profitForWeek(d){
    var ws=weekStartStr(d), we=addDaysStr(ws,6);
    var rows=deptRows().filter(function(r){var rd=normDate(r[0]); return rd>=ws&&rd<=we;});
    return profitForRows(rows);
  }
  function profitText(t, label){
    if(!t) return null;
    var out=label+'\nProfit (priced categories only): '+usd(t.profit)+'\nSales (priced categories only): '+usd(t.sales)+'\nItems sold: '+t.qty;
    if(t.unpriced.length) out+='\nProfit could NOT be calculated for: '+t.unpriced.join(', ')+' — no buy price set yet. Set the buy/sell prices on the Profit panel and ask again.';
    else out+='\nAll sold categories had prices set.';
    return out;
  }
  function shiftLines(rows, idx, label){
    var parts=[];
    rows.forEach(function(r){
      var sh=String(r[1]||'');
      var name=SHIFT_LABELS.filter(function(l){return sh.indexOf(l)===0;})[0]||sh;
      parts.push(name+': '+label(num(r[idx])));
    });
    return parts.join('\n');
  }
  function answer(key, d, extra){
    var rows=rowsForDate(d), ws=weekStartStr(d), we=addDaysStr(ws,6);
    var wrows=rowsForWeek(d);
    var head='';
    function src(){ return '\n\nSource: closing-report sheets (reports feed). '+feedNote+' Date asked: '+fmtDay(d)+'.'; }
    if(key==='profit-day'){
      if(!rows.length) return 'No closed shifts in the system for '+fmtDay(d)+' yet.'+src();
      var t=profitForDate(d);
      if(!t) return 'Department quantities are not in the system for '+fmtDay(d)+' yet. Department sales are only in the feed for: '+deptDates().join(', ')+'. Profit cannot be calculated without them.'+src();
      return (profitText(t,'Profit on '+fmtDay(d))||'')+src();
    }
    if(key==='profit-week'){
      if(!wrows.length) return 'No closed shifts in the system for the week of '+fmtDay(ws)+' to '+fmtDay(we)+' yet.'+src();
      var tw=profitForWeek(d);
      if(!tw) return 'Department quantities are not in the system for the week of '+fmtDay(ws)+' to '+fmtDay(we)+' yet. Department sales are only in the feed for: '+deptDates().join(', ')+'.'+src();
      return (profitText(tw,'Profit for the week '+fmtDay(ws)+' to '+fmtDay(we))||'')+src();
    }
    if(key==='sales-day'){
      if(!rows.length) return 'No closed shifts in the system for '+fmtDay(d)+' yet.'+src();
      return 'Total sales on '+fmtDay(d)+': '+usd(sumIdx(rows,4))+'\nNet sales: '+usd(sumIdx(rows,5))+'\nTransactions: '+sumIdx(rows,6)+'\nInside sales: '+usd(sumIdx(rows,10))+'\nGas sales: '+usd(sumIdx(rows,9))+' ('+sumIdx(rows,8)+' gal)\nTax collected: '+usd(sumIdx(rows,11))+'\n'+shiftLines(rows,4,usd)+src();
    }
    if(key==='sales-week'){
      if(!wrows.length) return 'No closed shifts in the system for the week of '+fmtDay(ws)+' to '+fmtDay(we)+' yet.'+src();
      return 'Total sales for the week '+fmtDay(ws)+' to '+fmtDay(we)+': '+usd(sumIdx(wrows,4))+'\nNet sales: '+usd(sumIdx(wrows,5))+'\nTransactions: '+sumIdx(wrows,6)+'\nInside sales: '+usd(sumIdx(wrows,10))+'\nGas sales: '+usd(sumIdx(wrows,9))+' ('+sumIdx(wrows,8)+' gal)'+src();
    }
    if(key==='dept-day'){
      if(!rows.length) return 'No closed shifts in the system for '+fmtDay(d)+' yet.'+src();
      var dr=deptForDate(d);
      if(!dr.length) return 'Department quantities are not in the system for '+fmtDay(d)+' yet. Department sales are only in the feed for: '+deptDates().join(', ')+'.'+src();
      var lines=['Sales by department on '+fmtDay(d)+':'];
      var totQ=0, totS=0;
      CATS.forEach(function(name,ci){
        var q=0, s=0, hasSell=false;
        dr.forEach(function(r){var x=num(r[2+ci]); q=r2(q+x); var pr=priceByName(name); if(pr.sell>0){s=r2(s+x*pr.sell); hasSell=true;}});
        if(q>0){ totQ=r2(totQ+q); totS=r2(totS+s); lines.push(name+': '+q+' sold'+(hasSell?' — '+usd(s):' — sell price not set, sales unknown')); }
      });
      lines.push('Total items: '+totQ+(totS>0?' · Sales (priced categories): '+usd(totS):''));
      return lines.join('\n')+src();
    }
    if(key==='cash-day'){
      if(!rows.length) return 'No closed shifts in the system for '+fmtDay(d)+' yet.'+src();
      var synced=rows.filter(function(r){return String(r[33]||'')!=='';}).length;
      if(!synced) return 'No shift-sheet data was uploaded for '+fmtDay(d)+' yet, so cash collected is not in the system for this date.'+src();
      return 'Cash collected on '+fmtDay(d)+' (synced shifts: '+synced+' of '+rows.length+'):\nCash counted: '+usd(sumIdx(rows,22))+'\nCards: '+usd(sumIdx(rows,26))+' (Credit '+usd(sumIdx(rows,24))+' + Debit '+usd(sumIdx(rows,25))+')\nEBT: '+usd(sumIdx(rows,27))+'\nCollected: '+usd(sumIdx(rows,30))+'\nSafe drops: '+usd(sumIdx(rows,23))+'\n'+shiftLines(rows,30,usd)+src();
    }
    if(key==='safe-day'){
      if(!rows.length) return 'No closed shifts in the system for '+fmtDay(d)+' yet.'+src();
      var synced2=rows.filter(function(r){return String(r[33]||'')!=='';}).length;
      if(!synced2) return 'No shift-sheet data was uploaded for '+fmtDay(d)+' yet, so the cash in the safe is not in the system for this date.'+src();
      return 'Cash in the safe for '+fmtDay(d)+': '+usd(sumIdx(rows,23))+' (safe drops total, synced shifts: '+synced2+' of '+rows.length+')\nCash counted: '+usd(sumIdx(rows,22))+'\nExpected deposit to safe: '+usd(sumIdx(rows,32))+src();
    }
    if(key==='fuel-day'){
      if(!rows.length) return 'No closed shifts in the system for '+fmtDay(d)+' yet.'+src();
      var gp=sumIdx(rows,37);
      var out='Fuel profit on '+fmtDay(d)+': '+usd(gp)+'\n87: '+usd(sumIdx(rows,34))+' · 89: '+usd(sumIdx(rows,35))+' · 93: '+usd(sumIdx(rows,36));
      if(gp===0) out+='\nGas profit is $0.00 in the feed for this date — it was not entered on the website for these shifts.';
      out+='\nGas sold: '+sumIdx(rows,8)+' gal for '+usd(sumIdx(rows,9))+src();
      return out;
    }
    if(key==='payouts-day'){
      if(!rows.length) return 'No closed shifts in the system for '+fmtDay(d)+' yet.'+src();
      return 'Pay outs on '+fmtDay(d)+': '+usd(sumIdx(rows,15))+'\n'+shiftLines(rows,15,usd)+'\nPer-person payee names are not in the reports feed, so I cannot break this down by person from here — the breakdown is on the Monthly sheet, Pay Outs by Payee tab.'+src();
    }
    if(key==='vendors-day'){
      if(!rows.length) return 'No closed shifts in the system for '+fmtDay(d)+' yet.'+src();
      return 'Vendors paid on '+fmtDay(d)+': pay outs total '+usd(sumIdx(rows,15))+'. Vendor names are not in the reports feed, so I cannot list the vendors from here. See the Vendors tab on the shift sheet, or the Monthly sheet, Pay Outs by Payee tab.'+src();
    }
    if(key==='payee'){
      var name=(extra&&extra.name)||'';
      var dd=(extra&&extra.date)||d;
      var rr=rowsForDate(dd);
      if(!rr.length) return 'No closed shifts in the system for '+fmtDay(dd)+' yet.'+src();
      return 'Pay outs to '+(name||'that person')+' on '+fmtDay(dd)+' cannot be answered from the reports feed — per-person payee names are not in it. Total pay outs that day were '+usd(sumIdx(rr,15))+'. The per-person breakdown is on the Monthly sheet, Pay Outs by Payee tab.'+src();
    }
    if(key==='short-day'){
      if(!rows.length) return 'No closed shifts in the system for '+fmtDay(d)+' yet.'+src();
      var so=sumIdx(rows,31);
      var state=so===0?'Balanced':(so<0?'Short '+usd(so):'Over '+usd(so));
      return 'Cash on '+fmtDay(d)+': '+state+'\nShort / Over total: '+usd(so)+'\n'+shiftLines(rows,31,usd)+src();
    }
    if(key==='txns-day'){
      if(!rows.length) return 'No closed shifts in the system for '+fmtDay(d)+' yet.'+src();
      return 'Transactions on '+fmtDay(d)+': '+sumIdx(rows,6)+'\nAverage ticket: '+usd(sumIdx(rows,4)/Math.max(1,sumIdx(rows,6)))+'\nVoids: '+sumIdx(rows,12)+'\nNo Sales: '+sumIdx(rows,13)+src();
    }
    if(key==='gas-day'){
      if(!rows.length) return 'No closed shifts in the system for '+fmtDay(d)+' yet.'+src();
      return 'Gas sold on '+fmtDay(d)+': '+sumIdx(rows,8)+' gallons for '+usd(sumIdx(rows,9))+src();
    }
    if(key==='cash-week'){
      if(!wrows.length) return 'No closed shifts in the system for the week of '+fmtDay(ws)+' to '+fmtDay(we)+' yet.'+src();
      var syn=wrows.filter(function(r){return String(r[33]||'')!=='';}).length;
      return 'Cash collected for the week '+fmtDay(ws)+' to '+fmtDay(we)+' (synced shifts: '+syn+' of '+wrows.length+'):\nCash counted: '+usd(sumIdx(wrows,22))+'\nCards: '+usd(sumIdx(wrows,26))+'\nEBT: '+usd(sumIdx(wrows,27))+'\nCollected: '+usd(sumIdx(wrows,30))+'\nSafe drops: '+usd(sumIdx(wrows,23))+'\nShort / Over: '+usd(sumIdx(wrows,31))+src();
    }
    return 'I can only answer from the system data — profit, sales, department sales, cash, fuel profit, vendors and pay outs. Pick one of the prebuilt questions above.';
  }
  var QS=[
    ['profit-day','What was my profit on this date?'],
    ['profit-week','What was my profit this week?'],
    ['sales-day','What were total sales on this date?'],
    ['sales-week','What were total sales this week?'],
    ['dept-day','Sales by department on this date'],
    ['cash-day','How much cash was collected?'],
    ['safe-day','How much cash is in the safe?'],
    ['fuel-day','What was my fuel profit?'],
    ['payouts-day','How much did I pay out?'],
    ['vendors-day','Which vendors were paid?'],
    ['payee','Pay out to a person — type it below'],
    ['short-day','Was cash short or over?'],
    ['txns-day','How many transactions?'],
    ['gas-day','How much gas did I sell?'],
    ['cash-week','Cash collected this week']
  ];
  var toggle=document.getElementById('askAiToggle');
  var offNote=document.getElementById('askAiOffNote');
  var body=document.getElementById('askAiBody');
  var dateIn=document.getElementById('askAiDate');
  var qsBox=document.getElementById('askAiQs');
  var input=document.getElementById('askAiInput');
  var sendBtn=document.getElementById('askAiSend');
  var ansBox=document.getElementById('askAiAnswer');
  var srcEl=document.getElementById('askAiSrc');
  dateIn.value=todayStr();
  QS.forEach(function(q){
    var b=document.createElement('button');
    b.type='button'; b.textContent=q[1]; b.setAttribute('data-ask',q[0]);
    b.addEventListener('click',function(){
      if(q[0]==='payee'){ input.value='How much did I pay '; input.focus(); showAnswer('Type the person and the date, for example: How much did I pay PAINT on 2026-11-11?'); return; }
      ask(q[0], dateIn.value||todayStr(), null);
    });
    qsBox.appendChild(b);
  });
  function showAnswer(text){
    ansBox.hidden=false; ansBox.textContent=text;
    srcEl.textContent=feedNote;
  }
  function getDate(){
    var v=dateIn.value||todayStr();
    return validDate(v)?v:todayStr();
  }
  function ask(key, d, extra){
    if(!toggle.checked){ showAnswer('Ask AI is off. Switch it on first.'); return; }
    showAnswer('Loading the system data…');
    feedLoad(function(ok){
      if(!ok){ showAnswer('Could not load the sheets — check connection and try again.'); return; }
      showAnswer(answer(key, d, extra));
    });
  }
  function parseFree(text){
    var t=String(text||'').toLowerCase();
    var d=getDate();
    var dm=t.match(/(\d{4}-\d{2}-\d{2})/);
    if(dm&&validDate(dm[1])) d=dm[1];
    else if(t.indexOf('yesterday')>=0) d=addDaysStr(getDate(),-1);
    else if(t.indexOf('last week')>=0) d=addDaysStr(getDate(),-7);
    var m2=text.match(/pay(?:out| out)?\s+(?:to\s+|for\s+)?([A-Za-z][A-Za-z &\.\-]{1,40}?)(?:\s+on\s+|$)/i);
    if(m2){
      var nm=m2[1].trim();
      if(/^[A-Za-z][A-Za-z &\.\-]{1,40}$/.test(nm)&&nm.toLowerCase()!=='on'&&nm.toLowerCase()!=='out')
        return {key:'payee', date:d, extra:{name:nm.toUpperCase(), date:d}};
    }
    if(t.indexOf('profit')>=0) return {key:t.indexOf('week')>=0?'profit-week':'profit-day', date:d};
    if(t.indexOf('department')>=0) return {key:'dept-day', date:d};
    if(t.indexOf('fuel profit')>=0||t.indexOf('gas profit')>=0) return {key:'fuel-day', date:d};
    if(t.indexOf('gas')>=0&&(t.indexOf('gallon')>=0||t.indexOf('sell')>=0||t.indexOf('sold')>=0)) return {key:'gas-day', date:d};
    if(t.indexOf('safe')>=0) return {key:'safe-day', date:d};
    if(t.indexOf('cash')>=0) return {key:t.indexOf('week')>=0?'cash-week':'cash-day', date:d};
    if(t.indexOf('short')>=0||t.indexOf('over')>=0) return {key:'short-day', date:d};
    if(t.indexOf('transaction')>=0) return {key:'txns-day', date:d};
    if(t.indexOf('vendor')>=0) return {key:'vendors-day', date:d};
    if(t.indexOf('pay out')>=0||t.indexOf('payout')>=0||t.indexOf('pay')>=0) return {key:'payouts-day', date:d};
    if(t.indexOf('sale')>=0) return {key:t.indexOf('week')>=0?'sales-week':'sales-day', date:d};
    return {key:null, date:d};
  }
  function askFree(){
    var text=input.value.trim();
    if(!text){ showAnswer('Type a question, or tap one of the prebuilt questions above.'); return; }
    var p=parseFree(text);
    if(!p.key){ showAnswer('I can only answer from the system data — profit, sales, department sales, cash, fuel profit, vendors and pay outs. Pick one of the prebuilt questions above.'); return; }
    ask(p.key, p.date, p.extra||null);
  }
  sendBtn.addEventListener('click', askFree);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); askFree(); } });
  toggle.addEventListener('change', function(){
    var on=toggle.checked;
    offNote.hidden=on; body.hidden=!on;
    if(on){ showAnswer('Ask AI is on. Pick a date and tap a question — answers come from your sheets.'); feedLoad(function(){}); }
    else { ansBox.hidden=true; srcEl.textContent=''; }
  });
  btn.addEventListener('click', function(){
    var open=panel.hidden;
    panel.hidden=!open; panel.setAttribute('aria-hidden', open?'false':'true');
    if(open) panel.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
  document.getElementById('askAiClose').addEventListener('click', function(){
    panel.hidden=true; panel.setAttribute('aria-hidden','true');
  });
})();
</script>

</body></html>
